version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The reference gateways ship pinned dependencies into users' projects.
  # The Go gateway has no go.mod in this tree (go.mod.scaffold); the weekly
  # gateway-audit workflow runs govulncheck on it.
  - package-ecosystem: pip
    directory: /internal/scaffold/templates/advanced/gateways/python
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /internal/scaffold/templates/advanced/gateways/typescript
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /internal/scaffold/templates/advanced/gateways/csharp/Gateway
      - /internal/scaffold/templates/advanced/gateways/csharp/Gateway.Tests
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /internal/scaffold/templates/advanced/gateways/rust
    schedule:
      interval: weekly
