name: Examples

# The end-to-end example gates. Defined once and called by both ci.yml and
# release.yml: a tag used to run only the package tests, so a release could
# publish while the flagship examples in the README were broken.
on:
  workflow_call:
    inputs:
      impl:
        description: Which pgmi the examples run on, go or rust (the Rust leg is non-blocking until switch day)
        type: string
        default: go

jobs:
  example-test-gated:
    name: Example — test-gated deployment
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5434/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Success path — tests pass, deployment commits
        working-directory: examples/test-gated-deploy
        run: ../../pgmi deploy . -d pgmi_example --force --param env=dev

      - name: Failure path — failing test rolls the whole deployment back
        working-directory: examples/test-gated-deploy
        run: |
          cp break-it/test_audit_log.sql __test__/
          set +e
          ../../pgmi deploy . -d pgmi_example_broken --force --param env=dev
          code=$?
          set -e
          test "$code" -eq 13 || { echo "expected exit 13, got $code"; exit 1; }

      - name: Verify rollback — the failed deploy left no trace
        run: |
          rolled_back=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5434 -U postgres -d pgmi_example_broken -tAc \
            "SELECT to_regclass('public.audit_log') IS NULL")
          test "$rolled_back" = "t" || { echo "audit_log survived the rollback"; exit 1; }

  example-execution-order:
    name: Example — execution-order policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5435/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Success path — one file at two plan positions, deploy commits
        working-directory: examples/execution-order-policy/project
        run: ../../../pgmi deploy . -d catalog_demo --force

      - name: Verify — catalog load committed
        run: |
          count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5435 -U postgres -d catalog_demo -tAc \
            "SELECT count(*) FROM catalog.product")
          test "$count" = "5" || { echo "expected 5 products, got $count"; exit 1; }

      - name: Failure path — duplicate sort key fails the collision gate
        working-directory: examples/execution-order-policy/project
        run: |
          cp ../break-it/012_categories.sql load/
          set +e
          ../../../pgmi deploy . -d catalog_demo --force
          code=$?
          set -e
          rm load/012_categories.sql
          test "$code" -eq 13 || { echo "expected exit 13, got $code"; exit 1; }

      - name: Failure path — unlisted file fails the manifest assertion
        working-directory: examples/execution-order-policy/project
        run: |
          cp ../break-it/015_discounts.sql load/
          set +e
          ../../../pgmi deploy . -d catalog_demo --force
          code=$?
          set -e
          rm load/015_discounts.sql
          test "$code" -eq 13 || { echo "expected exit 13, got $code"; exit 1; }

      - name: Verify — failed deploys executed no project script
        run: |
          untouched=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5435 -U postgres -d catalog_demo -tAc \
            "SELECT to_regclass('catalog.category') IS NULL AND to_regclass('catalog.discount') IS NULL")
          test "$untouched" = "t" || { echo "a rejected deploy left objects behind"; exit 1; }

  example-seed-demo:
    name: Example — seed-demo (desired-state reference data)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5437/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: First deploy — seeds roles and permissions, tests pass
        working-directory: examples/seed-demo
        run: ../../pgmi deploy . -d seed_demo --force

      - name: Redeploy — idempotent, same seed file converges with no changes
        working-directory: examples/seed-demo
        run: ../../pgmi deploy . -d seed_demo --force

      - name: Verify — catalog invariants hold after two deploys
        run: |
          role_count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5437 -U postgres -d seed_demo -tAc \
            "SELECT count(*) FROM role WHERE deprecated_at IS NULL")
          test "$role_count" -gt 0 || { echo "expected at least one active role"; exit 1; }
          perm_count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5437 -U postgres -d seed_demo -tAc \
            "SELECT count(*) FROM permission WHERE deprecated_at IS NULL")
          test "$perm_count" -gt 0 || { echo "expected at least one active permission"; exit 1; }

  example-lock-safe:
    name: Example — lock-safe deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5436/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Deploy — atomic head, then CIC / backfill / CIC in psql mode
        working-directory: examples/lock-safe-deploy/project
        run: ../../../pgmi deploy . -d lock_safe_demo --force

      - name: Verify — both concurrent indexes are VALID
        run: |
          valid=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -tAc \
            "SELECT bool_and(i.indisvalid) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
             WHERE c.relname IN ('idx_orders_customer', 'idx_orders_status')
             HAVING count(*) = 2")
          test "$valid" = "t" || { echo "expected 2 VALID concurrent indexes"; exit 1; }

      - name: Verify — deferred constraint was validated in the tail
        run: |
          validated=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -tAc \
            "SELECT convalidated FROM pg_constraint WHERE conname = 'orders_amount_nonneg'")
          test "$validated" = "t" || { echo "orders_amount_nonneg should be validated"; exit 1; }

      - name: Failure path — broken tail statement leaves earlier units applied
        working-directory: examples/lock-safe-deploy/project
        run: |
          cp deploy.sql deploy.sql.bak
          cp ../break-it/deploy.sql deploy.sql
          set +e
          ../../../pgmi deploy . -d lock_safe_broken --force
          code=$?
          set -e
          mv deploy.sql.bak deploy.sql
          test "$code" -eq 13 || { echo "expected exit 13, got $code"; exit 1; }

      - name: Verify — earlier tail units survived the mid-tail failure
        run: |
          idx_customer=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_broken -tAc \
            "SELECT i.indisvalid FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
             WHERE c.relname = 'idx_orders_customer'")
          test "$idx_customer" = "t" || { echo "idx_orders_customer should survive the later failure"; exit 1; }
          no_status_idx=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_broken -tAc \
            "SELECT to_regclass('idx_orders_status') IS NULL")
          test "$no_status_idx" = "t" || { echo "idx_orders_status should not exist (it referenced a bad column)"; exit 1; }

      - name: Recovery — corrected redeploy converges
        working-directory: examples/lock-safe-deploy/project
        run: ../../../pgmi deploy . -d lock_safe_broken --force

      - name: Verify — recovery deploy created both indexes
        run: |
          both_valid=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_broken -tAc \
            "SELECT bool_and(i.indisvalid) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
             WHERE c.relname IN ('idx_orders_customer', 'idx_orders_status')
             HAVING count(*) = 2")
          test "$both_valid" = "t" || { echo "expected both indexes VALID after recovery"; exit 1; }

      - name: Failure path — a failed concurrent build leaves an INVALID index
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -c             "DROP INDEX idx_orders_customer;"
          set +e
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -c             "CREATE UNIQUE INDEX CONCURRENTLY idx_orders_customer ON orders (customer_id);"
          set -e
          invalid=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -tAc             "SELECT NOT i.indisvalid FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
             WHERE c.relname = 'idx_orders_customer'")
          test "$invalid" = "t" || { echo "setup failed: expected an INVALID index"; exit 1; }

      - name: Recovery — the deploy reaps the INVALID index and rebuilds it
        working-directory: examples/lock-safe-deploy/project
        run: ../../../pgmi deploy . -d lock_safe_demo --force

      - name: Verify — the leftover was reaped and the index is healthy again
        run: |
          state=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5436 -U postgres -d lock_safe_demo -tAc             "SELECT i.indisvalid AND NOT i.indisunique FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
             WHERE c.relname = 'idx_orders_customer'")
          test "$state" = "t" || { echo "expected a valid, non-unique rebuilt index"; exit 1; }

      - name: Redeploy — the tail is idempotent, a second run converges
        working-directory: examples/lock-safe-deploy/project
        run: ../../../pgmi deploy . -d lock_safe_demo --force

  example-tap-reporter:
    name: Example — TAP reporter callback
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5438:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5438/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Deploy with TAP callback — tests emit TAP 14 output
        working-directory: examples/tap-reporter
        run: |
          output=$(../../pgmi deploy . -d tap_demo --force 2>&1)
          echo "$output"
          echo "$output" | grep -q 'TAP version 14' || { echo "missing TAP version line"; exit 1; }
          echo "$output" | grep -q '1\.\.2' || { echo "missing plan line"; exit 1; }
          echo "$output" | grep -q 'ok 1 - ' || { echo "missing ok 1"; exit 1; }
          echo "$output" | grep -q 'ok 2 - ' || { echo "missing ok 2"; exit 1; }

      - name: Redeploy — idempotent, TAP output reproduced
        working-directory: examples/tap-reporter
        run: ../../pgmi deploy . -d tap_demo --force

  docs-walkthrough:
    name: Docs — README and Quickstart walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Run the documented first-run path verbatim
        run: scripts/verify-walkthrough.sh ./pgmi

  example-apply-once:
    name: Example — apply-once tracking
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5439/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: First deploy applies both migrations
        working-directory: examples/apply-once-tracking/project
        run: ../../../pgmi deploy . -d apply_once_demo --force

      # Both migrations fail if run twice (CREATE TABLE, INSERT of fixed keys),
      # so a successful redeploy is itself the proof that neither re-ran.
      - name: Redeploy runs nothing
        working-directory: examples/apply-once-tracking/project
        run: ../../../pgmi deploy . -d apply_once_demo --force

      - name: Verify — two rows, two ledger entries
        run: |
          got=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5439 -U postgres -d apply_once_demo -tAc \
            "SELECT (SELECT count(*) FROM app.customer) || '/' || (SELECT count(*) FROM app.migration_log)")
          test "$got" = "2/2" || { echo "expected 2 customers and 2 ledger rows, got $got"; exit 1; }

      - name: Reformatting an applied migration is not drift
        working-directory: examples/apply-once-tracking/project
        run: |
          cp ../break-it/reformatted/001_customer.sql migrations/
          ../../../pgmi deploy . -d apply_once_demo --force
          git checkout -- migrations/001_customer.sql

      - name: Editing an applied migration fails the deploy
        working-directory: examples/apply-once-tracking/project
        run: |
          cp ../break-it/edited/001_customer.sql migrations/
          set +e
          ../../../pgmi deploy . -d apply_once_demo --force
          code=$?
          set -e
          git checkout -- migrations/001_customer.sql
          test "$code" -eq 13 || { echo "expected exit 13, got $code"; exit 1; }

      - name: Verify — the edited migration never ran
        run: |
          cols=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 5439 -U postgres -d apply_once_demo -tAc \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'app' AND table_name = 'customer' AND column_name = 'email'")
          test "$cols" = "0" || { echo "the rejected migration added its column"; exit 1; }


  # Each client job runs the gateway's own tests, then the language-neutral
  # end-to-end harness (internal/scaffold/testdata/gateways/e2e) against the
  # running gateway. A suite a gateway does not implement yet is listed in
  # EXPECTED_MISSING: it still runs and is reported, and the job fails once
  # it passes, so the list is shortened as each port lands.
  client-python:
    name: Client — Python reference gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5441:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5441/postgres
      DATABASE_URL: postgresql://clients_gateway:gateway@127.0.0.1:5441/clients_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Scaffold the advanced template and deploy it with env=dev
        run: PGMI_BIN=$PWD/pgmi internal/scaffold/testdata/gateways/prepare.sh "$RUNNER_TEMP/project" clients_e2e

      - name: Install the client's and the end-to-end harness's requirements
        run: |
          pip install -r "$RUNNER_TEMP/project/gateways/python/requirements.txt"
          pip install -r internal/scaffold/testdata/gateways/e2e/requirements.txt

      - name: Audit the client's pinned dependencies
        working-directory: ${{ runner.temp }}/project/gateways/python
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: The scaffolded client's tests against the deployed template
        working-directory: ${{ runner.temp }}/project/gateways/python
        run: python -m unittest -v test_gateway

      - name: The end-to-end harness (REST, MCP, OIDC sign-in, interceptors) against the running gateway
        env:
          PGMI_BIN: ${{ github.workspace }}/pgmi
          EXPECTED_MISSING: rpc
          GATEWAY_DIR: ${{ runner.temp }}/project/gateways/python
          GATEWAY_COMMAND: python gateway.py
        run: python internal/scaffold/testdata/gateways/e2e/run.py

      - name: The database tests ran (a skipped run signs nobody in)
        run: internal/scaffold/testdata/gateways/signed-in.sh client-python

  client-typescript:
    name: Client — TypeScript reference gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5442/postgres
      DATABASE_URL: postgresql://clients_gateway:gateway@127.0.0.1:5442/clients_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Scaffold the advanced template and deploy it with env=dev
        run: PGMI_BIN=$PWD/pgmi internal/scaffold/testdata/gateways/prepare.sh "$RUNNER_TEMP/project" clients_e2e

      - name: Build and test the scaffolded client against the deployed template
        working-directory: ${{ runner.temp }}/project/gateways/typescript
        run: |
          npm ci --no-audit --no-fund
          npm audit
          npm test

      - name: The end-to-end harness (REST, MCP, OIDC sign-in, interceptors, OAuth) against the running gateway
        env:
          PGMI_BIN: ${{ github.workspace }}/pgmi
          EXPECTED_MISSING: rpc
          GATEWAY_DIR: ${{ runner.temp }}/project/gateways/typescript
          GATEWAY_COMMAND: node dist/main.js
        run: |
          pip install -r internal/scaffold/testdata/gateways/e2e/requirements.txt
          python internal/scaffold/testdata/gateways/e2e/run.py

      - name: The database tests ran (a skipped run signs nobody in)
        run: internal/scaffold/testdata/gateways/signed-in.sh client-typescript

  client-go:
    name: Client — Go reference gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5443:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5443/postgres
      DATABASE_URL: postgresql://clients_gateway:gateway@127.0.0.1:5443/clients_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Scaffold the advanced template and deploy it with env=dev
        run: PGMI_BIN=$PWD/pgmi internal/scaffold/testdata/gateways/prepare.sh "$RUNNER_TEMP/project" clients_e2e

      - name: Build and test the scaffolded client, its own module, against the deployed template
        working-directory: ${{ runner.temp }}/project/gateways/go
        run: |
          go vet ./...
          go test -race -v -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go build -race -o gateway .

      - name: The end-to-end harness (REST, MCP, OIDC sign-in, interceptors, OAuth) against the running gateway, built with the race detector
        env:
          PGMI_BIN: ${{ github.workspace }}/pgmi
          GATEWAY_DIR: ${{ runner.temp }}/project/gateways/go
          GATEWAY_COMMAND: ./gateway
          GORACE: halt_on_error=1
        run: |
          pip install -r internal/scaffold/testdata/gateways/e2e/requirements.txt
          python internal/scaffold/testdata/gateways/e2e/run.py

      - name: The database tests ran (a skipped run signs nobody in)
        run: internal/scaffold/testdata/gateways/signed-in.sh client-go

  client-csharp:
    name: Client — C# reference gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5444/postgres
      DATABASE_URL: postgresql://clients_gateway:gateway@127.0.0.1:5444/clients_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Scaffold the advanced template and deploy it with env=dev
        run: PGMI_BIN=$PWD/pgmi internal/scaffold/testdata/gateways/prepare.sh "$RUNNER_TEMP/project" clients_e2e

      - name: Start a TLS-only PostgreSQL for the sslmode test
        run: internal/scaffold/testdata/gateways/tls-postgres.sh 5460 "$RUNNER_TEMP/tls"

      - name: Build and test the scaffolded client against the deployed template (official .NET SDK image)
        working-directory: ${{ runner.temp }}/project/gateways/csharp
        run: |
          docker run --rm --network host -e DATABASE_URL -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/tls:$RUNNER_TEMP/tls:ro" -e REQUIRE_TLS_TEST=1 \
            -e TLS_DATABASE_URL="postgresql://postgres:postgres@localhost:5460/postgres?sslmode=require" \
            -e TLS_CA="$RUNNER_TEMP/tls/ca.pem" -e TLS_WRONG_CA="$RUNNER_TEMP/tls/wrong-ca.pem" \
            mcr.microsoft.com/dotnet/sdk:10.0.403 \
            sh -c 'dotnet test Gateway.Tests && dotnet list Gateway package --vulnerable --include-transitive | tee /tmp/vulnerable && ! grep -q "has the following vulnerable packages" /tmp/vulnerable && dotnet publish Gateway -c Release -o out'

      - name: The end-to-end harness (REST, MCP, OIDC sign-in, interceptors, OAuth) against the running gateway
        env:
          PGMI_BIN: ${{ github.workspace }}/pgmi
          EXPECTED_MISSING: rpc
          GATEWAY_DIR: ${{ runner.temp }}/project/gateways/csharp
          GATEWAY_COMMAND: >-
            docker run --rm --name pgmi-gateway-{port} --network host --env-file {env_file}
            -v ${{ runner.temp }}/project/gateways/csharp:/src -w /src
            mcr.microsoft.com/dotnet/sdk:10.0.403 dotnet out/Gateway.dll
          GATEWAY_STOP: docker rm -f pgmi-gateway-{port}
        run: |
          pip install -r internal/scaffold/testdata/gateways/e2e/requirements.txt
          python internal/scaffold/testdata/gateways/e2e/run.py

      - name: The database tests ran (a skipped run signs nobody in)
        run: internal/scaffold/testdata/gateways/signed-in.sh client-csharp

  client-rust:
    name: Client — Rust reference gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5445/postgres
      DATABASE_URL: postgresql://clients_gateway:gateway@127.0.0.1:5445/clients_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: .github/scripts/build-pgmi.sh "${{ inputs.impl }}"

      - name: Scaffold the advanced template and deploy it with env=dev
        run: PGMI_BIN=$PWD/pgmi internal/scaffold/testdata/gateways/prepare.sh "$RUNNER_TEMP/project" clients_e2e

      - name: Start a TLS-only PostgreSQL for the sslmode test
        run: internal/scaffold/testdata/gateways/tls-postgres.sh 5460 "$RUNNER_TEMP/tls"

      - name: Build and test the scaffolded client against the deployed template (official Rust image)
        working-directory: ${{ runner.temp }}/project/gateways/rust
        run: |
          docker run --rm --network host -e DATABASE_URL -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/tls:$RUNNER_TEMP/tls:ro" -e REQUIRE_TLS_TEST=1 \
            -e TLS_DATABASE_URL="postgresql://postgres:postgres@localhost:5460/postgres?sslmode=require" \
            -e TLS_CA="$RUNNER_TEMP/tls/ca.pem" -e TLS_WRONG_CA="$RUNNER_TEMP/tls/wrong-ca.pem" \
            rust:1.99.0-trixie sh -c 'cargo install cargo-audit --locked --version 0.22.2 && cargo audit \
              && cargo test --locked \
              && REQUIRE_SYSTEM_ROOTS_TEST=1 SSL_CERT_FILE="$TLS_CA" cargo test --locked --offline --test tls_system_roots \
              && cargo build --locked'

      - name: The end-to-end harness (REST, MCP, OIDC sign-in, interceptors, OAuth) against the running gateway
        env:
          PGMI_BIN: ${{ github.workspace }}/pgmi
          EXPECTED_MISSING: rpc
          GATEWAY_DIR: ${{ runner.temp }}/project/gateways/rust
          GATEWAY_COMMAND: >-
            docker run --rm --name pgmi-gateway-{port} --network host --env-file {env_file}
            -v ${{ runner.temp }}/project/gateways/rust:/src -w /src
            rust:1.99.0-trixie target/debug/pgmi-gateway
          GATEWAY_STOP: docker rm -f pgmi-gateway-{port}
        run: |
          pip install -r internal/scaffold/testdata/gateways/e2e/requirements.txt
          python internal/scaffold/testdata/gateways/e2e/run.py

      - name: The database tests ran (a skipped run signs nobody in)
        run: internal/scaffold/testdata/gateways/signed-in.sh client-rust
