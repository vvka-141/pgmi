name: Snapshot Build

# A full `release --snapshot`: builds, archives, packages and checksums every
# target, uploading nothing. `goreleaser check` in the release gate validates
# config syntax and renders no template, so an archive name_template or nfpms
# entry that only breaks at render time would first break while publishing —
# after the tag is pushed. release.yml calls this before it publishes.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test built binary
        run: |
          # dist/ holds four files named exactly `pgmi` — linux and darwin,
          # amd64 and arm64. Without the path filter `head -n 1` takes whichever
          # find happens to return first, and a darwin or arm64 binary on this
          # runner exits 126, "cannot execute binary file". Name the one this
          # job can actually run.
          bin="$(find dist -maxdepth 2 -path '*linux_amd64*' -name pgmi -type f | head -n 1)"
          if [[ -z "$bin" ]]; then
            echo "::error::no linux/amd64 pgmi binary found in dist/" >&2
            find dist -maxdepth 2 -name 'pgmi*' -type f >&2
            exit 1
          fi
          chmod +x "$bin"
          version="$("$bin" --version 2>&1)"
          echo "pgmi --version: $version"
          if echo "$version" | grep -qiE '(dev|unknown)'; then
            echo "::error::snapshot binary reports dev/unknown version: $version" >&2
            exit 1
          fi

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pgmi-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 14
