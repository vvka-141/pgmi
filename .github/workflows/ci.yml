name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feature-*', 'features/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docs-rust:
    name: Docs describe the Rust binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-docs-rust.sh

  # The black-box suite runs the built binary from outside, as a user does:
  # every case but those in rust/blackbox-skip.txt, with the last Go release
  # (0.14.1) as the reference for the cross-binary checksum cases. 15 is the
  # floor the binary enforces; the advanced-template cases skip below 18,
  # that template's own floor.
  blackbox:
    name: Black-box suite (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['18', '15']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: The last Go release, as the reference
        run: .github/scripts/go-reference.sh "$RUNNER_TEMP/pgmi-go"

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Run every case
        env:
          PGMI_BIN: ${{ github.workspace }}/target/release/pgmi
          PGMI_REFERENCE_BIN: ${{ runner.temp }}/pgmi-go
          PGMI_IMPL: rust
        run: |
          python -m pip install --require-hashes -r blackbox/uv-requirements.txt
          cd blackbox
          mapfile -t skip < <(sed -n 's|^\([^#[:space:]][^[:space:]]*\).*|--deselect=test_cases.py::test_case[cases/\1.yaml]|p' ../rust/blackbox-skip.txt)
          uv run --locked pytest test_cases.py "${skip[@]}"

  # Fault injection (proxy, locks, signals, flaky sign-in) on pgmi and on the
  # last Go release. A failure on pgmi alone is a result worse than Go's in bad
  # weather.
  bad-weather:
    name: Bad weather (pgmi and Go 0.14.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: The last Go release, as the reference
        run: .github/scripts/go-reference.sh "$RUNNER_TEMP/pgmi-go"

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Go 0.14.1
        env:
          PGMI_BIN: ${{ runner.temp }}/pgmi-go
          PGMI_IMPL: go
        run: |
          python -m pip install --require-hashes -r blackbox/uv-requirements.txt
          cd blackbox && uv run --locked pytest -k bad-weather test_cases.py

      - name: pgmi
        if: ${{ !cancelled() }}
        env:
          PGMI_BIN: ${{ github.workspace }}/target/release/pgmi
          PGMI_IMPL: rust
        run: cd blackbox && uv run --locked pytest -k bad-weather test_cases.py

  # pgmi and the last Go release on the same input; every difference is
  # explained in blackbox/differential-allow.yaml. Kept through the test
  # period before 1.0 (PGMI-894).
  differential:
    name: Differential (pgmi vs Go 0.14.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: The last Go release, as the reference
        run: .github/scripts/go-reference.sh "$RUNNER_TEMP/pgmi-go"

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Run the differential harness
        env:
          PGMI_BIN: ${{ runner.temp }}/pgmi-go
          PGMI_BIN_OTHER: ${{ github.workspace }}/target/release/pgmi
        run: |
          python -m pip install --require-hashes -r blackbox/uv-requirements.txt
          cd blackbox && uv run --locked pytest test_differential.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin
      - name: cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (testhooks)
        run: cargo clippy --locked -p pgmi --features testhooks --all-targets -- -D warnings
      - name: Format and clippy (fuzz crate)
        run: |
          cargo fmt --manifest-path rust/pgmi/fuzz/Cargo.toml --check
          cargo clippy --locked --manifest-path rust/pgmi/fuzz/Cargo.toml --all-targets -- -D warnings
      # The template deployment tests run in parallel; each advanced deploy
      # takes more locks than the default max_locks_per_transaction allows
      # several of at once, and a services container cannot pass -c.
      # PostgreSQL 17 proves the advanced template refuses a server below its floor.
      - name: PostgreSQL for the deployment tests
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18 -c max_locks_per_transaction=256
          docker run -d --name pg17 -p 5417:5432 -e POSTGRES_PASSWORD=postgres postgres:17
          for c in pg pg17; do
            for _ in $(seq 60); do docker exec $c pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
            docker exec $c pg_isready -h 127.0.0.1 -U postgres
          done
      - name: Test
        env:
          PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PGMI_TEST_CONN_PG17: postgresql://postgres:postgres@127.0.0.1:5417/postgres
          PGMI_REQUIRE_DB: '1'
        run: cargo test --locked --workspace
      - name: Test hooks (panic exits 3, Google sign-in through the fake admin API)
        env:
          PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PGMI_REQUIRE_DB: '1'
        run: cargo test --locked -p pgmi --features testhooks --test panic --test google_cloud_sql --test aws_credential_process_hang
      - name: Dependencies (advisories, licences, no C)
        run: cargo deny --locked check
      - name: No C compiler on any release target
        run: rust/check-no-c.sh
      - name: Static Linux binaries with rust-lld only
        env:
          CC: /bin/false
          CXX: /bin/false
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --release -p pgmi --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/pgmi target/aarch64-unknown-linux-musl/release/pgmi | tee /dev/stderr | grep -c "static" | grep -qx 2
          target/x86_64-unknown-linux-musl/release/pgmi --version
      - name: Packaged files equal tracked files
        run: rust/check-package.sh
      - name: Licence placeholder guards
        run: rust/release/placeholders-test.sh
      - name: The musl notice is for the musl this toolchain links
        run: |
          version="$(basename rust/release/notices/musl-*-COPYRIGHT | cut -d- -f2)"
          grep -aqF "$version" "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-musl/lib/self-contained/libc.a"

  fuzz:
    name: Fuzz (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      NIGHTLY: nightly-2026-10-28
    defaults:
      run:
        working-directory: rust/pgmi/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A download that fails is retried here; a crash in a fuzz run below
      # is never retried.
      - name: Toolchain and dependencies
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install "$NIGHTLY" --profile minimal \
              && cargo +"$NIGHTLY" install --locked cargo-fuzz@0.13.2 \
              && cargo +"$NIGHTLY" fetch --locked \
              && exit 0
            echo "::warning::toolchain or dependency download failed (attempt $attempt)"
            sleep $((attempt * 30))
          done
          exit 1
      - name: conn_parse
        run: cargo +"$NIGHTLY" fuzz run conn_parse -- -max_total_time=120 -timeout=20
      - name: sql_script
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run sql_script -- -max_total_time=120 -timeout=20
      - name: metadata_parse
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run metadata_parse -- -max_total_time=120 -timeout=20
      - name: dotenv_parse
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run dotenv_parse -- -max_total_time=120 -timeout=20
      - name: pgpass_find
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run pgpass_find -- -max_total_time=120 -timeout=20
      - name: tap_reader
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run tap_reader -- -max_total_time=120 -timeout=20
      - name: mcp_decoder
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run mcp_decoder -- -max_total_time=120 -timeout=20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: rust/pgmi/fuzz/artifacts/
          if-no-files-found: ignore

  # The rust-version Cargo.toml declares, not the pinned toolchain, so the
  # minimum stays true (record 0021).
  rust-msrv:
    name: Rust (minimum version)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Check the workspace
        run: cargo +"$MSRV" check --locked --workspace --all-targets

  # The Rust unit tests on the platforms whose code is cfg-gated: path
  # handling, the Windows environment and APPDATA, key-file modes, Unix
  # sockets, signals. Integration tests need PostgreSQL in a Linux container
  # and stay in the Linux job. Both shells on Windows: a test that resolved
  # `bash` through PATH once passed under Git Bash and failed from PowerShell.
  rust-platforms:
    name: Rust (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: bash
          - os: macos-latest
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: Unit tests
        run: cargo test --locked --workspace --lib --bins
      - name: Static C runtime and a deploy with the Windows binary
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        run: |
          cargo build --locked -p pgmi
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('target/debug/pgmi.exe'))
          if ($text -match '(?i)vcruntime140|api-ms-win-crt-') { Write-Error 'pgmi.exe needs the VC++ runtime'; exit 1 }
          & "$env:PGBIN\pg_ctl.exe" start -D "$env:PGDATA" -w
          New-Item -ItemType Directory -Force smoke | Out-Null
          Set-Content smoke/deploy.sql 'SELECT 1;'
          & target/debug/pgmi.exe deploy smoke --connection 'postgresql://postgres:root@127.0.0.1:5432/postgres?sslmode=disable'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  examples:
    name: Examples
    uses: ./.github/workflows/examples.yml

  # Advisory here, like vulncheck: a CVE published overnight must not red-line
  # an unrelated branch. The weekly schedule fails on a finding.
  gateway-audit:
    name: Gateway audit
    uses: ./.github/workflows/gateway-audit.yml
    with:
      advisory: true
