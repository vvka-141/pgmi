name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feature-*', 'features/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

      - name: dead code (production only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: -c .golangci-deadcode.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      # PGMI_REQUIRE_DB: without it an unreachable Docker daemon skips every
      # integration test and the job still passes.
      # The runner is discarded after the job, so testcontainers' reaper has
      # nothing to clean up; a failed reaper handshake reaped the shared
      # PostgreSQL mid-run. internal/scaffold alone takes over 10m under -race.
      - name: Run tests
        env:
          PGMI_REQUIRE_DB: '1'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: go test -race -tags pgmi_testhooks -timeout 25m ./...

  # The compatibility table is a claim, and until this job existed nothing
  # checked it: every test ran against a single PostgreSQL image. This job
  # covers the core and basic-template floor (15); the advanced template's
  # floor is 18, the image the `test` job already runs it on, so a construct
  # that silently raises either one red-lines instead of reaching a user.
  #
  # Official postgres:N images via `services`, which is both cheaper than
  # testcontainers for a matrix and published per major, so a version is one
  # matrix entry.
  test-pg-versions:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['15']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGMI_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Core and basic template
        run: |
          go test -timeout 25m \
            ./internal/services/... ./internal/params/... ./internal/contract/... \
            ./internal/files/... ./internal/cli/... ./internal/preprocessor/... \
            ./internal/db/... ./internal/metadata/...
          go test -timeout 10m -run 'TestTemplateDeployment/basic|TestSkillBlocksDeploy/basic' ./internal/scaffold

  # The black-box suite runs the built binary from outside, as a user does. It
  # is the executable contract the Rust re-implementation must pass unchanged
  # (PGMI_BIN points it at any binary).
  blackbox:
    name: Black-box suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build pgmi
        run: go build -o "$RUNNER_TEMP/pgmi" ./cmd/pgmi

      - name: Run the black-box suite
        env:
          PGMI_BIN: ${{ runner.temp }}/pgmi
        run: |
          python -m pip install uv==0.13.6
          cd blackbox && uv run --locked pytest

  # The Rust binary against the cases it passes so far (rust/blackbox-passing.txt),
  # with the Go binary as the reference for the cross-binary checksum cases.
  blackbox-rust:
    name: Black-box suite (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build the Go reference
        run: go build -o "$RUNNER_TEMP/pgmi-go" ./cmd/pgmi

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Run the passing cases
        env:
          PGMI_BIN: ${{ github.workspace }}/target/release/pgmi
          PGMI_REFERENCE_BIN: ${{ runner.temp }}/pgmi-go
          PGMI_IMPL: rust
        run: |
          python -m pip install uv==0.13.6
          cd blackbox
          mapfile -t cases < <(sed 's|.*|test_cases.py::test_case[cases/&.yaml]|' ../rust/blackbox-passing.txt)
          uv run --locked pytest "${cases[@]}"

  # Fault injection (proxy, locks, signals, flaky sign-in) on both binaries; non-blocking
  # (nothing needs it). A Rust failure here is a result worse than Go's in bad weather.
  bad-weather:
    name: Bad weather (Go and Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build the Go binary
        run: go build -o "$RUNNER_TEMP/pgmi-go" ./cmd/pgmi

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Go
        env:
          PGMI_BIN: ${{ runner.temp }}/pgmi-go
        run: |
          python -m pip install uv==0.13.6
          cd blackbox && uv run --locked pytest -k bad-weather test_cases.py

      - name: Rust
        if: ${{ !cancelled() }}
        env:
          PGMI_BIN: ${{ github.workspace }}/target/release/pgmi
          PGMI_IMPL: rust
        run: cd blackbox && uv run --locked pytest -k bad-weather test_cases.py

  # Go and Rust on the same input; non-blocking (nothing needs it) until the Rust port settles.
  differential:
    name: Differential (Go vs Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build the Go binary
        run: go build -o "$RUNNER_TEMP/pgmi-go" ./cmd/pgmi

      - name: Build the Rust binary
        run: |
          rustup toolchain install
          cargo build --locked --release -p pgmi

      - name: Run the differential harness
        env:
          PGMI_BIN: ${{ runner.temp }}/pgmi-go
          PGMI_BIN_OTHER: ${{ github.workspace }}/target/release/pgmi
        run: |
          python -m pip install uv==0.13.6
          cd blackbox && uv run --locked pytest test_differential.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin
      - name: cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (testhooks)
        run: cargo clippy --locked -p pgmi --features testhooks --all-targets -- -D warnings
      - name: Format and clippy (fuzz crate)
        run: |
          cargo fmt --manifest-path rust/pgmi/fuzz/Cargo.toml --check
          cargo clippy --manifest-path rust/pgmi/fuzz/Cargo.toml --all-targets -- -D warnings
      # The template deployment tests run in parallel; each advanced deploy
      # takes more locks than the default max_locks_per_transaction allows
      # several of at once, and a services container cannot pass -c.
      # PostgreSQL 17 proves the advanced template refuses a server below its floor.
      - name: PostgreSQL for the deployment tests
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18 -c max_locks_per_transaction=256
          docker run -d --name pg17 -p 5417:5432 -e POSTGRES_PASSWORD=postgres postgres:17
          for c in pg pg17; do
            for _ in $(seq 60); do docker exec $c pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
            docker exec $c pg_isready -h 127.0.0.1 -U postgres
          done
      - name: Test
        env:
          PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PGMI_TEST_CONN_PG17: postgresql://postgres:postgres@127.0.0.1:5417/postgres
          PGMI_REQUIRE_DB: '1'
        run: cargo test --locked --workspace
      - name: Panic exits 3 (testhooks)
        run: cargo test --locked -p pgmi --features testhooks --test panic
      - name: Dependencies (advisories, licences, no C)
        run: cargo deny --locked check
      - name: No C compiler on any release target
        run: rust/check-no-c.sh
      - name: Static Linux binaries with rust-lld only
        env:
          CC: /bin/false
          CXX: /bin/false
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --release -p pgmi --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/pgmi target/aarch64-unknown-linux-musl/release/pgmi | tee /dev/stderr | grep -c "static" | grep -qx 2
          target/x86_64-unknown-linux-musl/release/pgmi --version
      - name: Packaged files equal tracked files
        run: rust/check-package.sh

  fuzz:
    name: Fuzz (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      NIGHTLY: nightly-2026-10-28
    defaults:
      run:
        working-directory: rust/pgmi/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A download that fails is retried here; a crash in a fuzz run below
      # is never retried.
      - name: Toolchain and dependencies
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install "$NIGHTLY" --profile minimal \
              && cargo +"$NIGHTLY" install --locked cargo-fuzz@0.13.2 \
              && cargo +"$NIGHTLY" fetch \
              && exit 0
            echo "::warning::toolchain or dependency download failed (attempt $attempt)"
            sleep $((attempt * 30))
          done
          exit 1
      - name: conn_parse
        run: cargo +"$NIGHTLY" fuzz run conn_parse -- -max_total_time=120 -timeout=20
      - name: sql_script
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run sql_script -- -max_total_time=120 -timeout=20
      - name: metadata_parse
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run metadata_parse -- -max_total_time=120 -timeout=20
      - name: dotenv_parse
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run dotenv_parse -- -max_total_time=120 -timeout=20
      - name: pgpass_find
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run pgpass_find -- -max_total_time=120 -timeout=20
      - name: tap_reader
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run tap_reader -- -max_total_time=120 -timeout=20
      - name: mcp_decoder
        if: success() || failure()
        run: cargo +"$NIGHTLY" fuzz run mcp_decoder -- -max_total_time=120 -timeout=20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: rust/pgmi/fuzz/artifacts/
          if-no-files-found: ignore

  # The rust-version Cargo.toml declares, not the pinned toolchain, so the
  # minimum stays true (record 0021).
  rust-msrv:
    name: Rust (minimum version)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Check the workspace
        run: cargo +"$MSRV" check --locked --workspace --all-targets

  # The Rust unit tests on the platforms whose code is cfg-gated: path
  # handling, the Windows environment and APPDATA, key-file modes, Unix
  # sockets, signals. Integration tests need PostgreSQL in a Linux container
  # and stay in the Linux job. Both shells on Windows, as for Go below.
  rust-platforms:
    name: Rust (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: bash
          - os: macos-latest
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: Unit tests
        run: cargo test --locked --workspace --lib --bins

  # pgmi ships Windows and macOS binaries, so their behaviour has to be
  # exercised somewhere: path separators and drive letters in project scanning,
  # .pgpass location, CRLF through the head/tail splitter, signal handling.
  #
  # -short only. GitHub's Windows and macOS runners cannot run the Linux
  # containers the integration tests need, so PGMI_REQUIRE_DB would fail every
  # one of them. No -race either: on Windows it needs a C toolchain, and a data
  # race is in Go code rather than in the platform behaviour these jobs exist to
  # cover. The Linux job above runs the full suite under -race.
  test-platforms:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          # Both shells on Windows: a test that resolved `bash` through PATH
          # passed under Git Bash and failed from PowerShell (PGMI-239..244).
          # One shell green is not a green suite.
          - os: windows-latest
            shell: bash
          - os: macos-latest
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run unit tests
        run: go test -short -tags pgmi_testhooks -timeout 10m ./...

  connection-tests:
    name: Connection & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run connection tests
        env:
          PGMI_REQUIRE_DB: '1'
        run: go test -race -tags conntest -timeout 5m ./internal/db/conntest/...

  # Informational on branches: the vulnerability database moves independently of
  # this repo, so a CVE published overnight must not red-line unrelated PRs. The
  # release job runs the same pinned command as a hard gate.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  examples:
    name: Examples
    uses: ./.github/workflows/examples.yml

  # Non-blocking until switch day (PGMI-835): no job needs it.
  examples-rust:
    name: Examples (Rust)
    uses: ./.github/workflows/examples.yml
    with:
      impl: rust

  # Advisory here, like vulncheck: a CVE published overnight must not red-line
  # an unrelated branch. The weekly schedule fails on a finding.
  gateway-audit:
    name: Gateway audit
    uses: ./.github/workflows/gateway-audit.yml
    with:
      advisory: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, test-pg-versions, test-platforms, connection-tests, examples]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X github.com/vvka-141/pgmi/internal/cli.version=dev-${{ github.sha }}" \
            -o dist/pgmi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} \
            ./cmd/pgmi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgmi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
