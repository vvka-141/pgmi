name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feature-*', 'features/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # PGMI_REQUIRE_DB: without it an unreachable Docker daemon skips every
      # integration test and the job still passes.
      - name: Run tests
        env:
          PGMI_REQUIRE_DB: '1'
        run: go test -race -tags pgmi_testhooks -coverprofile=coverage.out -timeout 10m ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
        continue-on-error: true

  # The compatibility table is a claim, and until this job existed nothing
  # checked it: every test ran against a single PostgreSQL 17 image. Both floors
  # are covered — 11 for pgmi core and the basic template, 15 for the advanced
  # template — so a construct that silently raises either one red-lines here
  # instead of reaching a user.
  #
  # Official postgres:N images via `services`, which is both cheaper than
  # testcontainers for a matrix and published per major, so a version is one
  # matrix entry.
  test-pg-versions:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['11', '15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGMI_TEST_CONN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGMI_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Core and basic template
        run: |
          go test -timeout 25m \
            ./internal/services/... ./internal/params/... ./internal/contract/... \
            ./internal/files/... ./internal/cli/... ./internal/preprocessor/... \
            ./internal/db/... ./internal/metadata/...
          go test -timeout 10m -run 'TestTemplateDeployment/basic' ./internal/scaffold

      # The advanced template is 15+ and says so: it needs xid8 (13) and
      # security_invoker views (15). Running it on 11 would conflate the two
      # floors and make the core result unreadable.
      - name: Advanced template
        if: matrix.pg != '11'
        run: go test -timeout 15m ./internal/scaffold

  # pgmi ships Windows and macOS binaries, so their behaviour has to be
  # exercised somewhere: path separators and drive letters in project scanning,
  # .pgpass location, CRLF through the head/tail splitter, signal handling.
  #
  # -short only. GitHub's Windows and macOS runners cannot run the Linux
  # containers the integration tests need, so PGMI_REQUIRE_DB would fail every
  # one of them. No -race either: on Windows it needs a C toolchain, and a data
  # race is in Go code rather than in the platform behaviour these jobs exist to
  # cover. The Linux job above runs the full suite under -race.
  test-platforms:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          # Both shells on Windows: a test that resolved `bash` through PATH
          # passed under Git Bash and failed from PowerShell (PGMI-239..244).
          # One shell green is not a green suite.
          - os: windows-latest
            shell: bash
          - os: macos-latest
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: go test -short -tags pgmi_testhooks -timeout 10m ./...

  connection-tests:
    name: Connection & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run connection tests
        env:
          PGMI_REQUIRE_DB: '1'
        run: go test -race -tags conntest -timeout 5m ./internal/db/conntest/...

  # Informational on branches: the vulnerability database moves independently of
  # this repo, so a CVE published overnight must not red-line unrelated PRs. The
  # release job runs the same pinned command as a hard gate.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  examples:
    name: Examples
    uses: ./.github/workflows/examples.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, test-pg-versions, test-platforms, connection-tests, examples]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X github.com/vvka-141/pgmi/internal/cli.version=dev-${{ github.sha }}" \
            -o dist/pgmi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} \
            ./cmd/pgmi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pgmi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
