name: Verify Install

# Installs pgmi through every channel the README documents and checks that
# each one serves the latest release and that it works. Runs after each
# release (publishing to the tap lags by minutes) and weekly, because a channel
# can break with nothing changing here: a Homebrew deprecation, an install
# script edited on main. Weekly, not nightly: every run downloads release
# assets, and nightly runs swamped the download counts.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      expected_tag:
        description: 'Tag that must be the latest release (e.g. v0.12.2); empty checks whatever is latest'
        required: false
        default: ''

permissions:
  contents: read

# Explicit bash adds pipefail, so a failed `curl | bash` or `brew | tee` fails
# its own step instead of surfacing later as an empty version.
defaults:
  run:
    shell: bash

jobs:
  expected:
    name: Latest release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - name: Let the tap catch up
        if: github.event_name == 'workflow_run'
        run: sleep 600

      # Every channel below is compared against releases/latest, so a release
      # left as a draft or prerelease, or cut from an older commit than the
      # current latest, would pass here with every channel still serving the
      # old version. After a Release run the tag it built must BE latest.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.expected_tag }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          echo "latest release: $tag"
          if [ -n "$INTENDED" ] && [ "$tag" != "$INTENDED" ]; then
            echo "::error::releases/latest is $tag but the release just published is $INTENDED (left as a draft or prerelease, or cut from an older commit?)"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  assets:
    name: Release assets and checksums
    needs: expected
    runs-on: ubuntu-latest
    steps:
      # The install jobs exercise only their runner's arch; the other archives
      # and the .deb packages are checked here. Compares checksums.txt with the
      # sha256 digest GitHub publishes per asset, so only checksums.txt is
      # downloaded and the archive download counts stay free of CI.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.expected.outputs.version }}
        run: |
          tag="v$VERSION"
          packages="^pgmi_${VERSION}_(((linux|darwin)_(amd64|arm64)\.tar\.gz)|(windows_(amd64|arm64)\.zip)|(linux_(amd64|arm64)\.deb)) "
          gh release download "$tag" --repo "${{ github.repository }}" --pattern checksums.txt
          awk '{print $2 " " $1}' checksums.txt | grep -E "$packages" | sort > listed || true
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '.assets[] | "\(.name) \(.digest // "missing" | ltrimstr("sha256:"))"' \
            | grep -E "$packages" | sort > published || true
          [ "$(wc -l < published)" -eq 8 ] || { echo "::error::$tag should carry six archives and two .deb packages"; cat published; exit 1; }
          diff -u listed published || { echo "::error::checksums.txt disagrees with the digests GitHub publishes for $tag"; exit 1; }

  linux:
    name: ${{ matrix.channel }}
    needs: expected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [install.sh, install.sh without sudo, go install]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.channel == 'go install'
        with:
          go-version: '1.27'

      - name: Install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.channel }}" in
            install.sh)
              curl -sSL https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.sh | bash ;;
            "install.sh without sudo")
              curl -sSL https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
              echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
            "go install")
              (cd "$RUNNER_TEMP" && go list -m "github.com/vvka-141/pgmi@v${{ needs.expected.outputs.version }}")
              go install github.com/vvka-141/pgmi/cmd/pgmi@latest
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Serves the latest release
        run: |
          got="$(pgmi --version | head -n 1 | awk '{print $2}')"; got="${got#v}"
          echo "pgmi --version: $got"
          if [ "$got" != "${{ needs.expected.outputs.version }}" ]; then
            echo "::error::${{ matrix.channel }} serves $got, latest release is ${{ needs.expected.outputs.version }}"
            exit 1
          fi

      - name: Documented walkthrough
        run: scripts/verify-walkthrough.sh "$(command -v pgmi)"

  homebrew:
    name: homebrew
    needs: expected
    runs-on: macos-latest
    steps:
      - name: Install
        run: |
          brew install --cask vvka-141/pgmi/pgmi 2>&1 | tee brew.log
          if grep -q '^Warning:' brew.log; then
            grep '^Warning:' brew.log | while read -r line; do echo "::error::brew: $line"; done
            exit 1
          fi

      - name: Serves the latest release
        run: |
          got="$(pgmi --version | head -n 1 | awk '{print $2}')"; got="${got#v}"
          echo "pgmi --version: $got"
          if [ "$got" != "${{ needs.expected.outputs.version }}" ]; then
            echo "::error::homebrew serves $got, latest release is ${{ needs.expected.outputs.version }}"
            exit 1
          fi

      - name: Scaffolds a project
        run: pgmi init demo --template basic && test -f demo/deploy.sql

  windows:
    name: install.ps1
    needs: expected
    runs-on: windows-latest
    steps:
      - name: Install
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          irm https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.ps1 | iex
          "$env:LOCALAPPDATA\pgmi" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Serves the latest release
        shell: pwsh
        run: |
          $got = ((pgmi --version | Select-Object -First 1) -split ' ')[1].TrimStart('v')
          "pgmi --version: $got"
          if ($got -ne "${{ needs.expected.outputs.version }}") {
            "::error::install.ps1 serves $got, latest release is ${{ needs.expected.outputs.version }}"
            exit 1
          }

      - name: Scaffolds a project
        shell: pwsh
        run: |
          pgmi init demo --template basic
          if (-not (Test-Path demo/deploy.sql)) { exit 1 }
