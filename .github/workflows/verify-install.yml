name: Verify Install

# Installs pgmi through every channel the README documents (0.20: the GitHub
# release assets, install.sh, install.ps1 and Homebrew), on x86-64 and arm64,
# and checks that each one serves the latest release, built from its tag's
# commit, and that it works. Runs after each release (the Rust release's
# publish job dispatches it; publishing to the tap lags by minutes) and
# weekly, because a channel
# can break with nothing changing here: a Homebrew deprecation, an install
# script edited on main. Weekly, not nightly: every run downloads release
# assets, and nightly runs swamped the download counts.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      expected_tag:
        description: 'Tag that must be the latest release (e.g. v0.12.2); empty checks whatever is latest'
        required: false
        default: ''
      settle_seconds:
        description: 'Seconds to wait first, so the tap catches up (the release dispatch passes 600)'
        required: false
        default: '0'

permissions:
  contents: read
  attestations: read

# Explicit bash adds pipefail, so a failed `curl | bash` or `brew | tee` fails
# its own step instead of surfacing later as an empty version.
defaults:
  run:
    shell: bash

jobs:
  expected:
    name: Latest release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      commit: ${{ steps.latest.outputs.commit }}
    steps:
      - name: Let the tap catch up
        if: github.event_name == 'workflow_run' || inputs.settle_seconds != '0'
        run: sleep "${{ github.event_name == 'workflow_run' && '600' || inputs.settle_seconds }}"

      # Every channel below is compared against releases/latest, so a release
      # left as a draft or prerelease, or cut from an older commit than the
      # current latest, would pass here with every channel still serving the
      # old version. After a Release run the tag it built must BE latest.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.expected_tag }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          echo "latest release: $tag"
          if [ -n "$INTENDED" ] && [ "$tag" != "$INTENDED" ]; then
            echo "::error::releases/latest is $tag but the release just published is $INTENDED (left as a draft or prerelease, or cut from an older commit?)"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(gh api "repos/${{ github.repository }}/commits/$tag" --jq .sha)" >> "$GITHUB_OUTPUT"

  assets:
    name: Release assets and checksums
    needs: expected
    runs-on: ubuntu-latest
    steps:
      # The install jobs exercise only their runner's arch; the other archives
      # and the .deb packages are checked here. Compares checksums.txt with the
      # sha256 digest GitHub publishes per asset, so only checksums.txt is
      # downloaded and the archive download counts stay free of CI.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.expected.outputs.version }}
        run: |
          tag="v$VERSION"
          packages="^pgmi_${VERSION}_(((linux|darwin)_(amd64|arm64)\.tar\.gz)|(windows_(amd64|arm64)\.zip)|(linux_(amd64|arm64)\.deb)) "
          gh release download "$tag" --repo "${{ github.repository }}" --pattern checksums.txt
          awk '{print $2 " " $1}' checksums.txt | grep -E "$packages" | sort > listed || true
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '.assets[] | "\(.name) \(.digest // "missing" | ltrimstr("sha256:"))"' \
            | grep -E "$packages" | sort > published || true
          [ "$(wc -l < published)" -eq 8 ] || { echo "::error::$tag should carry six archives and two .deb packages"; cat published; exit 1; }
          diff -u listed published || { echo "::error::checksums.txt disagrees with the digests GitHub publishes for $tag"; exit 1; }

      - name: Attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.expected.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern "pgmi_${VERSION}_linux_amd64.tar.gz"
          case "$VERSION" in
            0.[0-9].*|0.1[0-9].*) signer=release.yml ref="refs/tags/v$VERSION" ;;
            *) signer=release-rust.yml ref=refs/heads/main ;;
          esac
          gh attestation verify "pgmi_${VERSION}_linux_amd64.tar.gz" --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/$signer" --source-ref "$ref"

  linux:
    name: ${{ matrix.channel }} (${{ matrix.os }})
    needs: expected
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        channel: [install.sh, install.sh without sudo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.channel }}" in
            install.sh)
              curl -sSL https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.sh | bash ;;
            "install.sh without sudo")
              curl -sSL https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
              echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Serves the latest release, built from its tag
        env:
          WANT: ${{ needs.expected.outputs.version }}
          COMMIT: ${{ needs.expected.outputs.commit }}
        run: |
          pgmi --version
          got="$(pgmi --version | head -n 1 | awk '{print $2}')"; got="${got#v}"
          [ "$got" = "$WANT" ] || { echo "::error::${{ matrix.channel }} serves $got, latest release is $WANT"; exit 1; }
          built="$(pgmi --version | sed -n 's/^Commit: \([0-9a-f]*\),.*/\1/p')"
          if [ -z "$built" ] || [ "${COMMIT#"$built"}" = "$COMMIT" ]; then
            echo "::error::${{ matrix.channel }} was built from '$built', the tag is ${COMMIT:0:8}"; exit 1
          fi

      - name: Documented walkthrough
        run: scripts/verify-walkthrough.sh "$(command -v pgmi)"

  homebrew:
    name: homebrew (${{ matrix.os }})
    needs: expected
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - name: Install
        run: |
          brew install --cask vvka-141/pgmi/pgmi 2>&1 | tee brew.log
          if grep -q '^Warning:' brew.log; then
            grep '^Warning:' brew.log | while read -r line; do echo "::error::brew: $line"; done
            exit 1
          fi

      - name: Serves the latest release, built from its tag
        env:
          WANT: ${{ needs.expected.outputs.version }}
          COMMIT: ${{ needs.expected.outputs.commit }}
        run: |
          pgmi --version
          got="$(pgmi --version | head -n 1 | awk '{print $2}')"; got="${got#v}"
          [ "$got" = "$WANT" ] || { echo "::error::homebrew serves $got, latest release is $WANT"; exit 1; }
          built="$(pgmi --version | sed -n 's/^Commit: \([0-9a-f]*\),.*/\1/p')"
          if [ -z "$built" ] || [ "${COMMIT#"$built"}" = "$COMMIT" ]; then
            echo "::error::homebrew was built from '$built', the tag is ${COMMIT:0:8}"; exit 1
          fi

      - name: Scaffolds a project
        run: pgmi init demo --template basic && test -f demo/deploy.sql

  windows:
    name: install.ps1 (${{ matrix.os }})
    needs: expected
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - name: Install
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          irm https://raw.githubusercontent.com/vvka-141/pgmi/main/scripts/install.ps1 | iex
          "$env:LOCALAPPDATA\pgmi" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Serves the latest release
        shell: pwsh
        run: |
          $lines = @(pgmi --version)
          $lines
          $got = ($lines[0] -split ' ')[1].TrimStart('v')
          if ($got -ne "${{ needs.expected.outputs.version }}") {
            "::error::install.ps1 serves $got, latest release is ${{ needs.expected.outputs.version }}"
            exit 1
          }
          $built = if ($lines[1] -match '^Commit: ([0-9a-f]+),') { $Matches[1] } else { '' }
          if (-not $built -or -not "${{ needs.expected.outputs.commit }}".StartsWith($built)) {
            "::error::install.ps1 was built from '$built', the tag is ${{ needs.expected.outputs.commit }}"
            exit 1
          }

      - name: Scaffolds a project
        shell: pwsh
        run: |
          pgmi init demo --template basic
          if (-not (Test-Path demo/deploy.sql)) { exit 1 }
