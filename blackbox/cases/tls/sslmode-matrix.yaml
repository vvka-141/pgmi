description: each sslmode against a TLS server whose certificate is for localhost and signed by a private CA
servers: [tls]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@127.0.0.1:{tls_port}/postgres?sslmode=disable", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: false}}}
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@127.0.0.1:{tls_port}/postgres?sslmode=allow", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: false}}}
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@127.0.0.1:{tls_port}/postgres?sslmode=prefer", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: true}}}
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@127.0.0.1:{tls_port}/postgres?sslmode=require", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: true, sslmode: require}}}
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@127.0.0.1:{tls_port}/postgres?sslmode=verify-ca&sslrootcert={ca}", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: true, sslmode: verify-ca}}}
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@localhost:{tls_port}/postgres?sslmode=verify-full&sslrootcert={ca}", -d, "{db}", --json]
    expect: {exit: 0, json: {tls: {enabled: true, sslmode: verify-full}}}
