description: --aws with a profile whose credential_source is Ec2InstanceMetadata or EcsContainer assumes the profile's role with those credentials (fake IMDS, container endpoint and STS) and signs the token with the role's credentials
servers: [fakes]
home:
  .aws/config: |
    [profile imds]
    role_arn = arn:aws:iam::123456789012:role/fake
    credential_source = Ec2InstanceMetadata
    [profile ecs]
    role_arn = arn:aws:iam::123456789012:role/fake
    credential_source = EcsContainer
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-west-2, --connection, "host=127.0.0.1 port={recorder_port} user=cs_imds dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_PROFILE: imds, AWS_EC2_METADATA_SERVICE_ENDPOINT: "{fake_http}/", AWS_ENDPOINT_URL_STS: "{fake_http}/sts"}
    timeout: 60
    expect:
      exit: 11
      files:
        "{recorder_log}": ['"user": "cs_imds", "password": "[^"]*X-Amz-Credential=ASIAFAKEROLE%2F', '"user": "cs_imds", "password": "[^"]*X-Amz-Security-Token=fake-role-session-token']
        "{fake_http_log}": ["GET /latest/meta-data/iam/security-credentials", "POST /sts.*Credential=ASIAFAKEIMDS/"]
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-west-2, --connection, "host=127.0.0.1 port={recorder_port} user=cs_ecs dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_PROFILE: ecs, AWS_CONTAINER_CREDENTIALS_FULL_URI: "{fake_http}/ecs-credentials", AWS_ENDPOINT_URL_STS: "{fake_http}/sts"}
    timeout: 60
    expect:
      exit: 11
      files:
        "{recorder_log}": ['"user": "cs_ecs", "password": "[^"]*X-Amz-Credential=ASIAFAKEROLE%2F']
        "{fake_http_log}": ["GET /ecs-credentials", "POST /sts.*Credential=ASIAFAKEECS/"]
