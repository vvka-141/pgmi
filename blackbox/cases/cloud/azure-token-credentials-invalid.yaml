description: an AZURE_TOKEN_CREDENTIALS value that names no credential is refused before connecting; exit 1 in Go, exit 10 in Rust (contract "Three smaller differences")
servers: [tls]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --azure, --connection, "host=127.0.0.1 port={tls_port} user=nobody dbname=postgres sslmode=require", -d, "{db}"]
    env: {AZURE_TOKEN_CREDENTIALS: NoSuchCredential}
    timeout: 60
    expect:
      exit: 1
      stderr: ["AZURE_TOKEN_CREDENTIALS"]
      rust: {exit: 10}
