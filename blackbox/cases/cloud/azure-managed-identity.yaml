description: --azure with --azure-client-id signs in through managed identity (a fake App Service endpoint), passing the client ID and the PostgreSQL resource
servers: [tls, fakes]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --azure, --azure-client-id, 11111111-1111-1111-1111-111111111111, --connection, "host=127.0.0.1 port={tls_port} user={azure_user} dbname=postgres sslmode=require", -d, "{db}"]
    env: {IDENTITY_ENDPOINT: "{fake_http}/msi/token", IDENTITY_HEADER: secret-header}
    timeout: 60
    expect:
      exit: 0
      files:
        "{fake_http_log}": ["GET /msi/token\\?.*client_id=11111111-1111-1111-1111-111111111111", "resource=https%3A%2F%2Fossrdbms-aad\\.database\\.windows\\.net"]
