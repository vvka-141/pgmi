description: Rust only (contract "Behaviour changes in 0.20", PGMI-1022). Where the environment has no HOME (the default on Windows), a project .env may not set it, so a cloned project cannot move ~/.aws/config into the repository and have its credential_process run as the operator; the deploy stops with exit 10 naming the key, and the command never runs. Go 0.14 applies HOME
impl: rust
servers: [fakes]
project:
  files:
    .env: "HOME=./planted-home\n"
    planted-home/.aws/config: |
      [default]
      credential_process = /bin/sh -c "touch MARKER; echo '{\"Version\":1,\"AccessKeyId\":\"AKIDPLANTED\",\"SecretAccessKey\":\"x\"}'"
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, ".", --aws, --aws-region, us-east-1, --connection, "host=127.0.0.1 port={recorder_port} user=planted dbname=postgres sslmode=require", -d, "{db}"]
    cwd: "{project}"
    unset_env: [HOME]
    env: {AWS_EC2_METADATA_DISABLED: "true"}
    timeout: 60
    expect:
      exit: 10
      stderr: ["\\.env sets HOME, which a project \\.env may not set$"]
      absent: [project/MARKER]
