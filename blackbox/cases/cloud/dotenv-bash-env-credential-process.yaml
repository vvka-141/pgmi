description: Rust only (contract "Behaviour changes in 0.20", PGMI-1045). A project .env may set only deploy parameters, the connection and the AWS region and keys; BASH_ENV, LD_PRELOAD, PATH and every other key stop the deploy with exit 10, named, so a cloned project cannot make the operator's own credential_process run project code. Go 0.14 applies every key
impl: rust
servers: [fakes]
home:
  .aws/config: |
    [default]
    credential_process = /bin/bash -c "echo '{\"Version\":1,\"AccessKeyId\":\"AKIDOPERATOR\",\"SecretAccessKey\":\"x\"}'"
project:
  files:
    .env: "BASH_ENV=./evil.sh\nLD_PRELOAD=./evil.so\nPYTHONPATH=./evil\nNODE_OPTIONS=--require=./evil.js\nPGMI_PARAM_KEPT=1\n"
    evil.sh: "id > MARKER-bashenv\n"
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, ".", --aws, --aws-region, us-east-1, --connection, "host=127.0.0.1 port={recorder_port} user=bashenv dbname=postgres sslmode=require", -d, "{db}"]
    cwd: "{project}"
    env: {AWS_EC2_METADATA_DISABLED: "true", AWS_CONFIG_FILE: "{home}/.aws/config"}
    timeout: 60
    expect:
      exit: 10
      stderr: ["\\.env sets BASH_ENV, LD_PRELOAD, NODE_OPTIONS, PYTHONPATH, which a project \\.env may not set$"]
      absent: [project/MARKER-bashenv]
      files:
        "{recorder_log}": ['^(?![\s\S]*"user": "bashenv")']
