description: a profile whose credential_process prints credentials signs the RDS token with them, with or without an Expiration; a helper that fails is named and the sign-in fails (exit 11). The Rust binary runs the helper itself, with a time limit, so it never outlives pgmi (PGMI-1049)
servers: [fakes]
home:
  .aws/config: |
    [profile process]
    credential_process = /bin/sh -c "echo '{\"Version\":1,\"AccessKeyId\":\"AKIDPROCESS\",\"SecretAccessKey\":\"x\",\"SessionToken\":\"t\",\"Expiration\":\"2999-01-01T00:00:00Z\"}'"
    [profile plain]
    credential_process = /bin/sh -c "echo '{\"Version\":1,\"AccessKeyId\":\"AKIDPLAIN\",\"SecretAccessKey\":\"x\"}'"
    [profile failing]
    credential_process = /bin/sh -c "echo nope >&2; exit 3"
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-east-1, --connection, "host=127.0.0.1 port={recorder_port} user=process dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_PROFILE: process, AWS_CONFIG_FILE: "{home}/.aws/config", AWS_EC2_METADATA_DISABLED: "true"}
    timeout: 60
    expect:
      exit: 11
      files:
        "{recorder_log}": ['"user": "process", "password": "[^"]*X-Amz-Credential=AKIDPROCESS%2F[^"]*X-Amz-Security-Token=t']
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-east-1, --connection, "host=127.0.0.1 port={recorder_port} user=plain dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_PROFILE: plain, AWS_CONFIG_FILE: "{home}/.aws/config", AWS_EC2_METADATA_DISABLED: "true"}
    timeout: 60
    expect:
      exit: 11
      files:
        "{recorder_log}": ['"user": "plain", "password": "[^"]*X-Amz-Credential=AKIDPLAIN%2F']
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-east-1, --connection, "host=127.0.0.1 port={recorder_port} user=failing dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_PROFILE: failing, AWS_CONFIG_FILE: "{home}/.aws/config", AWS_EC2_METADATA_DISABLED: "true"}
    timeout: 60
    expect:
      exit: 11
      stderr_not: ["panicked at"]
      rust:
        exit: 11
        stderr: ["credential_process exited with exit status: 3: nope"]
