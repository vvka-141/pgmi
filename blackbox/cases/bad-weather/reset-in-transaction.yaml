description: a connection reset while the head transaction runs is exit 13 and commits nothing; the server drops the orphaned session (client_connection_check_interval), then the next deploy runs (Rust runs the deploy again (contract "Whole-deployment retry") and succeeds; with retry off it is exit 13, contract "Behaviour changes in 0.20")
proxy:
  - {query: head_sleep, do: reset, after: 0.5, times: 1, step: 1}
project:
  files:
    deploy.sql: |
      SET client_connection_check_interval = '100ms';
      BEGIN;
      CREATE TABLE IF NOT EXISTS marker (phase text);
      INSERT INTO marker VALUES ('head');
      SELECT pg_sleep(1.5) AS head_sleep;
      COMMIT;
      INSERT INTO marker VALUES ('tail-1');
      SELECT pg_sleep(1.5) AS tail_sleep;
      INSERT INTO marker VALUES ('tail-2');
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    expect:
      exit: 13
      sql:
        - query: SELECT to_regclass('marker') IS NULL
          rows: [[true]]
      rust:
        exit: 0
        stderr: ["^pgmi: attempt 1 failed \\(connection lost\\); retrying in"]
        sql:
          - query: SELECT coalesce(string_agg(phase, ',' ORDER BY ctid), '') FROM marker
            rows: [["head,tail-1,tail-2"]]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    delay: 1
    expect:
      exit: 0
      sql:
        - query: SELECT coalesce(string_agg(phase, ',' ORDER BY ctid), '') FROM marker
          rows: [["head,tail-1,tail-2"]]
      rust:
        stderr: ['^relation "marker" already exists, skipping$']
        sql:
          - query: SELECT coalesce(string_agg(phase, ',' ORDER BY ctid), '') FROM marker
            rows: [["head,tail-1,tail-2,head,tail-1,tail-2"]]
