description: a connection reset while the head transaction runs is exit 13 and commits nothing; the server drops the orphaned session (client_connection_check_interval), then the next deploy runs (Rust never retries a unit whose reply was lost, PGMI-970, and says so)
proxy:
  - {query: head_sleep, do: reset, after: 0.5, times: 1, step: 1}
project:
  files:
    deploy.sql: |
      SET client_connection_check_interval = '100ms';
      BEGIN;
      CREATE TABLE IF NOT EXISTS marker (phase text);
      INSERT INTO marker VALUES ('head');
      SELECT pg_sleep(1.5) AS head_sleep;
      COMMIT;
      INSERT INTO marker VALUES ('tail-1');
      SELECT pg_sleep(1.5) AS tail_sleep;
      INSERT INTO marker VALUES ('tail-2');
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    expect:
      exit: 13
      sql:
        - query: SELECT to_regclass('marker') IS NULL
          rows: [[true]]
      rust:
        stderr: ["^pgmi: attempt 1 failed \\(connection lost\\); not retried: unit 1 of 4 got no answer from the server, so whether it committed is unknown$"]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    delay: 1
    expect:
      exit: 0
      sql:
        - query: SELECT coalesce(string_agg(phase, ',' ORDER BY ctid), '') FROM marker
          rows: [["head,tail-1,tail-2"]]
