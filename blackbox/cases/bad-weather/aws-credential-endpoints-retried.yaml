description: an AWS container credentials endpoint that answers 500 twice is asked again, as the AWS SDK does, and the IAM token is signed with the credentials it then gives (the recorder refuses the login, exit 11)
servers: [fakes]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --aws, --aws-region, us-west-2, --connection, "host=127.0.0.1 port={recorder_port} user=bw_ecs dbname=postgres sslmode=require", -d, "{db}"]
    env: {AWS_CONTAINER_CREDENTIALS_FULL_URI: "{fake_http}/flaky/500x2/ecs-credentials"}
    timeout: 90
    expect:
      exit: 11
      files:
        "{recorder_log}": ['"user": "bw_ecs", "password": "[^"]*X-Amz-Credential=ASIAFAKEECS%2F']
        "{fake_http_log}": ["(GET /flaky/500x2/ecs-credentials.*\\n(.*\\n)*){3}"]
