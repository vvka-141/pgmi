description: SIGTERM while an autocommit tail statement runs cancels it on the server and is exit 130; the head and the earlier tail statements stay committed, the later ones never run
project:
  files:
    deploy.sql: |
      BEGIN;
      CREATE TABLE marker (phase text);
      INSERT INTO marker VALUES ('head');
      COMMIT;
      INSERT INTO marker VALUES ('tail-1');
      SELECT pg_sleep(30);
      INSERT INTO marker VALUES ('tail-2');
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    signal: {name: SIGTERM, after: 2}
    timeout: 20
    expect:
      exit: 130
      stderr: ["canceling statement due to user request"]
      sql:
        - query: SELECT string_agg(phase, ',' ORDER BY ctid) FROM marker
          rows: [["head,tail-1"]]
        - query: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND query LIKE '%pg_sleep(30)%' AND pid <> pg_backend_pid()
          rows: [[0]]
