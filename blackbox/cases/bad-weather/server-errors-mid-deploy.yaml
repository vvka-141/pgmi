description: a server that ends the session with FATAL 57P01 while the head runs, or with FATAL 08P01 in the tail, and one that answers the head with ERROR 25006 (read-only transaction) all fail the deploy with exit 13, the server's text and SQLSTATE, and only what was committed kept (Rust runs the deploy again (contract "Whole-deployment retry") after 57P01 in the head and succeeds; 08P01 in the tail comes after the head committed, so it is not retried (PGMI-918); 25006 from a primary stays final)
proxy:
  - {query: head_sleep, do: {error: "57P01"}, after: 0.5, times: 1, step: 1}
  - {query: head_sleep, do: {error: "25006", severity: ERROR}, step: 2}
  - {query: tail_sleep, do: {error: "08P01"}, after: 0.5, times: 1, step: 3}
project:
  files:
    deploy.sql: |
      SET client_connection_check_interval = '100ms';
      BEGIN;
      CREATE TABLE IF NOT EXISTS marker (phase text);
      INSERT INTO marker VALUES ('head');
      SELECT pg_sleep(1.5) AS head_sleep;
      COMMIT;
      INSERT INTO marker VALUES ('tail-1');
      SELECT pg_sleep(1.5) AS tail_sleep;
      INSERT INTO marker VALUES ('tail-2');
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    expect:
      exit: 13
      stderr: ["FATAL: terminating connection due to administrator command \\(SQLSTATE 57P01\\)"]
      sql:
        - query: SELECT to_regclass('marker') IS NULL
          rows: [[true]]
      rust:
        exit: 0
        stderr: ["^pgmi: attempt 1 failed \\(57P01 admin shutdown\\); retrying in"]
        sql:
          - query: SELECT string_agg(phase, ',' ORDER BY ctid) FROM marker
            rows: [["head,tail-1,tail-2"]]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    delay: 1
    expect:
      exit: 13
      stderr: ["ERROR: cannot execute INSERT in a read-only transaction \\(SQLSTATE 25006\\)"]
      sql:
        - query: SELECT to_regclass('marker') IS NULL
          rows: [[true]]
      rust:
        stderr_not: ["attempt 1 failed"]
        sql:
          - query: SELECT string_agg(phase, ',' ORDER BY ctid) FROM marker
            rows: [["head,tail-1,tail-2"]]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    expect:
      exit: 13
      stderr: ["FATAL: invalid frontend message type 0 \\(SQLSTATE 08P01\\)"]
      sql:
        - query: SELECT string_agg(phase, ',' ORDER BY ctid) FROM marker
          rows: [["head,tail-1"]]
      rust:
        stderr: ["^pgmi: attempt 1 failed \\(08P01 connection exception\\); not retried: 2 unit\\(s\\) already committed"]
        sql:
          - query: SELECT string_agg(phase, ',' ORDER BY ctid) FROM marker
            rows: [["head,tail-1,tail-2,head,tail-1"]]
