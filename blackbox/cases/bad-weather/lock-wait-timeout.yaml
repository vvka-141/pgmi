description: --timeout running out while a statement waits for a lock another session holds is exit 16, and the waiting statement is cancelled on the server
project:
  files:
    deploy.sql: |
      CREATE TABLE IF NOT EXISTS t (n int);
      SELECT pg_sleep(CASE WHEN current_setting('pgmi.setup', true) = 'true' THEN 0 ELSE 1 END);
      INSERT INTO t VALUES (1);
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    env: {PGMI_PARAM_SETUP: "true"}
    expect: {exit: 0}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --timeout, 2s]
    background: true
    timeout: 30
    expect:
      exit: 16
      stderr: ["exceeded --timeout 2s"]
      sql:
        - query: SELECT count(*) FROM t
          rows: [[1]]
        - query: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND query LIKE 'INSERT INTO t%' AND pid <> pg_backend_pid()
          rows: [[0]]
  - sql: BEGIN; LOCK TABLE t IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(3); COMMIT;
