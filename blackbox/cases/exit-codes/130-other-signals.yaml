description: SIGQUIT, SIGUSR1 and SIGUSR2 during a running deploy stop it like SIGTERM - the statement is cancelled, exit 130, and no session keeps running it, so the next deploy does not wait for the old one's lock (Rust, PGMI-999); Go dies at once on them and leaves the statement running
impl: rust
project:
  files:
    deploy.sql: SELECT pg_sleep(60) AS other_signals;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    signal: {name: SIGQUIT, after: 3}
    timeout: 45
    expect:
      exit: 130
      sql:
        - query: SELECT count(*) FROM pg_stat_activity WHERE query LIKE '%AS other_signals%' AND pid <> pg_backend_pid()
          rows: [[0]]
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    signal: {name: SIGUSR1, after: 3}
    timeout: 45
    expect:
      exit: 130
      sql:
        - query: SELECT count(*) FROM pg_stat_activity WHERE query LIKE '%AS other_signals%' AND pid <> pg_backend_pid()
          rows: [[0]]
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    signal: {name: SIGUSR2, after: 3}
    timeout: 45
    expect:
      exit: 130
      sql:
        - query: SELECT count(*) FROM pg_stat_activity WHERE query LIKE '%AS other_signals%' AND pid <> pg_backend_pid()
          rows: [[0]]
