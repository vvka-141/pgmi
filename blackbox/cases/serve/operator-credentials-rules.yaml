description: pgmi serve and the operator's credentials (Rust, PGMI-1005) - an unbracketed IPv6 entry in PGMI_SERVE_HOSTS is refused at start, exit 10; a deploy to a server the operator did not allow, with no password of its own, is told in the tool result that the operator's list is why; and a tool call cannot lower the operator's sslmode for a server that gets the operator's password, so it connects with TLS
servers: [tls]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [serve]
    env: {PGMI_SERVE_HOSTS: "::1:5432"}
    stdin: []
    expect:
      exit: 0
      rust:
        exit: 10
        stderr: ['PGMI_SERVE_HOSTS entry "::1:5432": an IPv6 address must be written in brackets']
  - pgmi: [serve]
    env: {PGHOST: localhost, PGPORT: "{tls_port}", PGUSER: "{user}", PGPASSWORD: "{password}"}
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"postgresql://{user}@127.0.0.1:{tls_port}/postgres?sslmode=disable","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      rust:
        exit: 0
        stderr: ['^pgmi serve: "127\.0\.0\.1:[0-9]+" is not a host the operator allowed']
        stdout: ['"id":2,"result".*the operator.s password is not used for \\"127\.0\.0\.1\\".*PGMI_SERVE_HOSTS']
  - pgmi: [serve]
    env: {PGHOST: 127.0.0.1, PGPORT: "{tls_port}", PGUSER: "{user}", PGPASSWORD: "{password}", PGSSLMODE: require}
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"postgresql://{user}@127.0.0.1:{tls_port}/postgres?sslmode=disable","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      rust:
        exit: 0
        stderr: ['^Executing deploy\.sql$']
        stdout: ['"id":2,"result".*"tls":\{"enabled":true']
