description: the serve deploy tool never reads the project .env, refuses overwrite without a matching confirmDatabaseName with exit code 12 before connecting (Rust also needs the operator's PGMI_SERVE_ALLOW_OVERWRITE=1, set here; case serve/overwrite-needs-operator-switch), and refuses an argument it does not know with exit code 10
project:
  files:
    .env: "PGMI_PARAM_FROM_DOTENV=dotenv\n"
    deploy.sql: |
      CREATE TABLE seen AS SELECT count(*) AS n FROM pg_temp.pgmi_parameter_view WHERE key = 'from_dotenv';
steps:
  - pgmi: [serve]
    env: {PGMI_SERVE_ALLOW_OVERWRITE: "1"}
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}"}}}'
      - wait: 4
      - '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}","overwrite":true}}}'
      - '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}","overwrite":true,"confirmDatabaseName":"other"}}}'
      - '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"init","arguments":{"path":"{workdir}/x","bogus":1}}}'
      - {until: '"id":2,', timeout: 60}
      - {until: '"id":3,', timeout: 60}
      - {until: '"id":4,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      stdout:
        - '(?m)^{"jsonrpc":"2.0","id":2,"result":{"content":\[{"type":"text","text":"deployed {db}: '
        - '(?m)^{"jsonrpc":"2.0","id":3,"result":{.*confirmDatabaseName.*"exitCode":12.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":4,"result":{.*does not match.*"exitCode":12.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":6,"result":{.*unknown argument \\"bogus\\".*"exitCode":10.*"isError":true}}$'
      absent: [x]
      sql:
        - query: SELECT n FROM seen
          rows: [[0]]
