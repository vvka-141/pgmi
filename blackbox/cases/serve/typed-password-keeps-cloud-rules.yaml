description: Rust only (pgmi serve and the operator's credentials, PGMI-1093). A cloud sign-in sends its token whatever password the tool call types, so a typed password does not switch the operator's trust rules off - with auth_method aws, azure or google in the project's pgmi.yaml, a call that types a password and names another sslrootcert than the operator's is refused (exit 10 in the tool result) before any sign-in; the same call without a cloud sign-in keeps its own sslrootcert and deploys with its typed password
impl: rust
servers: [tls]
project:
  files:
    deploy.sql: CREATE TABLE IF NOT EXISTS reached (n int);
    aws/deploy.sql: CREATE TABLE IF NOT EXISTS reached_aws (n int);
    aws/pgmi.yaml: |
      connection:
        auth_method: aws
        aws_region: eu-central-1
    azure/deploy.sql: CREATE TABLE IF NOT EXISTS reached_azure (n int);
    azure/pgmi.yaml: |
      connection:
        auth_method: azure
    google/deploy.sql: CREATE TABLE IF NOT EXISTS reached_google (n int);
    google/pgmi.yaml: |
      connection:
        auth_method: google
        google_instance: my-project:europe-west4:main
steps:
  - pgmi: [serve]
    env: {PGHOST: localhost, PGPORT: "{tls_port}", PGUSER: "{user}", PGSSLMODE: verify-ca, PGSSLROOTCERT: "{wrong_ca}", PGMI_SERVE_CLOUDSQL_INSTANCES: "my-project:europe-west4:main", AWS_ACCESS_KEY_ID: AKIDOPERATOR, AWS_SECRET_ACCESS_KEY: not-a-real-secret}
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/aws","connection":"postgresql://{user}:typed@localhost:{tls_port}/postgres?sslrootcert={ca}","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
      - '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/azure","connection":"postgresql://{user}:typed@localhost:{tls_port}/postgres?sslrootcert={ca}","database":"{db}"}}}'
      - {until: '"id":3,', timeout: 60}
      - '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/google","connection":"postgresql://{user}:typed@localhost:{tls_port}/postgres?sslrootcert={ca}","database":"{db}"}}}'
      - {until: '"id":4,', timeout: 60}
      - '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/aws","connection":"host=localhost port={tls_port} user={user} password=typed dbname=postgres sslrootcert={ca}","database":"{db}"}}}'
      - {until: '"id":5,', timeout: 60}
      - '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"postgresql://{user}:{password}@localhost:{tls_port}/postgres?sslrootcert={ca}","database":"{db}"}}}'
      - {until: '"id":6,', timeout: 60}
    timeout: 180
    expect:
      exit: 0
      stdout:
        - '(?m)^{"jsonrpc":"2.0","id":2,"result":{.*sslrootcert .* is not the operator.s own .*the operator.s cloud sign-in token.*"exitCode":10.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":3,"result":{.*sslrootcert .* is not the operator.s own .*the operator.s cloud sign-in token.*"exitCode":10.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":4,"result":{.*sslrootcert .* is not the operator.s own .*the operator.s cloud sign-in token.*"exitCode":10.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":5,"result":{.*sslrootcert .* is not the operator.s own .*the operator.s cloud sign-in token.*"exitCode":10.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":6,"result":{"content":\[{"type":"text","text":"deployed {db}: '
      stdout_not: ['pass a password in the connection string', 'AKIDOPERATOR']
      stderr: ['(?s)\A(?:(?!Executing deploy\.sql).)*Executing deploy\.sql(?:(?!Executing deploy\.sql).)*\Z']
