description: the serve deploy tool refuses a parameter key that is not an identifier, one holding = included, with exit code 10 before connecting
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [serve]
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}","params":{"env=prod":"x"}}}}'
      - {until: '"id":2,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      stdout:
        - '(?m)^{"jsonrpc":"2.0","id":2,"result":{.*invalid parameter key ''env=prod''.*"exitCode":10.*"isError":true}}$'
      stdout_not: ['deployed {db}']
