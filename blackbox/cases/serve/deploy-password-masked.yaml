description: a SQL PASSWORD literal in a failed deploy's error is masked in the serve answer's text, message and error
project:
  files:
    deploy.sql: |
      DO $$ BEGIN RAISE EXCEPTION 'ALTER ROLE r PASSWORD %', quote_literal(reverse('wp-terces-evres')); END $$;
steps:
  - pgmi: [serve]
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      stdout:
        - '"text":"[^"]*PASSWORD \[redacted\]'
        - '"message":"[^"]*PASSWORD \[redacted\]'
        - '"exitCode":13'
      stdout_not: ['serve-secret-pw']
