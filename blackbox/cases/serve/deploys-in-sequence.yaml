description: one serve process runs deploys one after another - a deploy that ends inside an open transaction and one whose tail block fails are reported as exit 13 and rolled back, and the next deploy to the same database is not refused as concurrent and succeeds
project:
  files:
    open/deploy.sql: |
      BEGIN;
      COMMIT;
      BEGIN;
      CREATE TABLE left_open ();
    tail/deploy.sql: |
      BEGIN;
      COMMIT;
      BEGIN;
      CREATE TABLE in_block ();
      SELECT 1/0;
      COMMIT;
    good/deploy.sql: |
      CREATE TABLE IF NOT EXISTS good (n int);
      INSERT INTO good VALUES (1);
    deploy.sql: SELECT 1;
steps:
  - pgmi: [serve]
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","method":"notifications/initialized"}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/open","connection":"{conn}","database":"{db}"}}}'
      - until: '"id":2,"result"'
        timeout: 45
      - '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/good","connection":"{conn}","database":"{db}"}}}'
      - until: '"id":3,"result"'
        timeout: 45
      - '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/tail","connection":"{conn}","database":"{db}"}}}'
      - until: '"id":4,"result"'
        timeout: 45
      - '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/good","connection":"{conn}","database":"{db}"}}}'
      - {until: '"id":5,', timeout: 60}
    timeout: 150
    expect:
      exit: 0
      stdout:
        - '(?m)^{"jsonrpc":"2.0","id":2,"result":{.*open transaction.*"exitCode":13.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":3,"result":{"content":\[{"type":"text","text":"deployed {db}: '
        - '(?m)^{"jsonrpc":"2.0","id":4,"result":{.*division by zero.*"exitCode":13.*"isError":true}}$'
        - '(?m)^{"jsonrpc":"2.0","id":5,"result":{"content":\[{"type":"text","text":"deployed {db}: '
      stdout_not: ['"exitCode":15']
      sql:
        - query: SELECT count(*) FROM pg_class WHERE relname IN ('left_open', 'in_block')
          rows: [[0]]
        - query: SELECT count(*) FROM good
          rows: [[2]]
