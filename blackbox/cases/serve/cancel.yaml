description: notifications/cancelled stops a deploy tool call mid-statement; the deploy rolls back and serve ends long before the deploy would have
project:
  files:
    deploy.sql: |
      CREATE TABLE before_sleep (n int);
      SELECT pg_sleep(30);
steps:
  - pgmi: [serve]
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","method":"notifications/initialized"}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"{conn}","database":"{db}"}}}'
      - wait: 4
      - '{"jsonrpc":"2.0","method":"notifications/cancelled","params":{"requestId":2,"reason":"blackbox"}}'
    timeout: 15
    expect:
      exit: 0
      sql:
        - query: SELECT count(*) FROM pg_class WHERE relname = 'before_sleep'
          rows: [[0]]
