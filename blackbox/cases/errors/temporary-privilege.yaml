description: a login without the TEMPORARY privilege on the target is told exactly which GRANT it needs
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect: {exit: 0}
  - sql: |
      CREATE ROLE "{db}_limited" LOGIN PASSWORD 'limited-pw';
      REVOKE TEMPORARY ON DATABASE "{db}" FROM PUBLIC;
      GRANT CONNECT ON DATABASE "{db}" TO "{db}_limited";
  - pgmi: [deploy, "{project}", --connection, "postgresql://{db}_limited:limited-pw@{host}:{port}/{db}", -d, "{db}"]
    expect:
      exit: 13
      stderr: ["GRANT TEMPORARY ON DATABASE"]
