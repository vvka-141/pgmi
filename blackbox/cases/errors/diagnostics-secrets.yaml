description: the connection password never reaches --json through the DETAIL, HINT or CONTEXT of a failed statement
project:
  files:
    deploy.sql: |
      DO $$
      BEGIN
          IF current_setting('pgmi.mode', true) = 'fail' THEN
              EXECUTE $q$DO $i$ BEGIN RAISE EXCEPTION 'boom' USING DETAIL = 'detail password=diag-secret-pw', HINT = 'hint password=diag-secret-pw'; END $i$ $q$;
          END IF;
      END $$;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect: {exit: 0}
  - sql: CREATE ROLE "{db}_deployer" LOGIN PASSWORD 'diag-secret-pw'
  - pgmi: [deploy, "{project}", --connection, "postgresql://{db}_deployer:diag-secret-pw@{host}:{port}/postgres", -d, "{db}", --param, mode=fail, --json]
    expect:
      exit: 13
      json: {status: failed, sqlstate: P0001}
      stdout: ["\"detail\": \"detail password=", "\"hint\": \"hint password=", "\"where\": \".*password="]
      stdout_not: ["diag-secret-pw"]
