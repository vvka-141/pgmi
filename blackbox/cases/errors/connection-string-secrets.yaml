description: a connection string that does not parse is refused (exit 10) without echoing it, on stderr and in the --json record
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "postgresql://u:S3cr/etPw@h/db", -d, "{db}"]
    expect: {exit: 10, stderr_not: ["S3cr", "etPw"]}
  - pgmi: [deploy, "{project}", --connection, "postgresql://u:S3cr/etPw@h/db", -d, "{db}", --json]
    expect: {exit: 10, stdout_not: ["S3cr", "etPw"], stderr_not: ["S3cr", "etPw"], json: {exitCode: 10}}
  - pgmi: [deploy, "{project}", --connection, "postgres:/admin:S3cretPw@db/x", -d, "{db}"]
    expect: {exit: 10, stderr_not: ["S3cretPw"]}
  - pgmi: [deploy, "{project}", --connection, "postgres:/admin:S3cretPw@db/x", -d, "{db}", --json]
    expect: {exit: 10, stdout_not: ["S3cretPw"], stderr_not: ["S3cretPw"], json: {exitCode: 10}}
