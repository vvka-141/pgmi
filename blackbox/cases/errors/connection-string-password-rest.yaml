description: a connection string is read as libpq and Go read it - a percent sign takes two hex digits, a URI fragment is dropped - and an unknown option written after an unquoted password is refused (exit 10) without its name under Rust, since it may be the password's rest ("Behaviour changes in 0.20", unknown option after a password)
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "postgresql://u:a%+Fb@h/db"]
    expect: {exit: 10, stderr_not: ["a%\\+Fb"]}
  - pgmi: [deploy, "{project}", --connection, "postgresql://h/db?application_name=a%+F"]
    expect: {exit: 10}
  - pgmi: [deploy, "{project}", --connection, "{conn}#fragment", -d, "{db}"]
    expect: {exit: 0}
  - pgmi: [deploy, "{project}", --connection, "Host=h;Password=ab;private-suffix=x;Database=d"]
    expect:
      exit: 10
      rust: {stderr_not: ["private-suffix"], stderr: ["invalid connection option \\(not shown"]}
  - pgmi: [deploy, "{project}", --connection, "host=h dbname=d password=ab private-suffix=x"]
    expect:
      exit: 10
      rust: {stderr_not: ["private-suffix"], stderr: ["invalid connection option \\(not shown"]}
  - pgmi: [deploy, "{project}", --connection, "host=h dbname=d bogus=1"]
    expect: {exit: 10, stderr: ["invalid connection option \"bogus\""]}
