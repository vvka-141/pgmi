description: a password equal to the login's own name hides nothing, so notices that print the name, or words that contain it, are shown as written
project:
  files:
    deploy.sql: |
      DO $$ BEGIN
        RAISE NOTICE 'running as % on %', current_user, current_user || 'ql';
      END $$;
steps:
  - sql: CREATE ROLE "{db}_same" LOGIN PASSWORD '{db}_same'
    database: maintenance
  - sql: CREATE DATABASE "{db}" OWNER "{db}_same"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "postgresql://{db}_same:{db}_same@{host}:{port}/{db}", -d, "{db}"]
    expect:
      exit: 0
      stderr: ["^running as {db}_same on {db}_sameql$"]
