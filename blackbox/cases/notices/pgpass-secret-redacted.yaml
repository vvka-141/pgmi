description: a password read from ~/.pgpass and printed by the server is shown as *** in notices, errors, --json and serve answers, as one from the connection string is (Rust; contract, "Behaviour changes in 0.20"); Go prints it
home:
  .pgpass: "{host}:{port}:*:{user}:{password}\n"
project:
  files:
    deploy.sql: |
      DO $$ BEGIN RAISE NOTICE 'pw=[{password}]' USING DETAIL = 'd=[{password}]'; END $$;
    fail/deploy.sql: |
      DO $$ BEGIN RAISE EXCEPTION 'pw=[{password}]'; END $$;
steps:
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}@{host}:{port}/postgres", -d, "{db}"]
    expect:
      exit: 0
      stderr: ['pw=\[{password}\]', 'd=\[{password}\]']
      rust:
        stderr: ['pw=\[\*\*\*\]', 'DETAIL: +d=\[\*\*\*\]']
        stderr_not: ['=\[{password}\]']
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}@{host}:{port}/postgres", -d, "{db}", --json]
    expect:
      exit: 0
      rust:
        stdout: ['"message": "pw=\[\*\*\*\]"', '"detail": "d=\[\*\*\*\]"']
        stdout_not: ['=\[{password}\]']
  - pgmi: [deploy, "{project}/fail", --connection, "postgresql://{user}@{host}:{port}/postgres", -d, "{db}", --json]
    expect:
      exit: 13
      rust:
        stderr: ['pw=\[\*\*\*\]']
        stderr_not: ['=\[{password}\]']
        stdout: ['pw=\[\*\*\*\]']
        stdout_not: ['=\[{password}\]']
  - pgmi: [serve]
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","method":"notifications/initialized"}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"postgresql://{user}@{host}:{port}/postgres","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
      - '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/fail","connection":"postgresql://{user}@{host}:{port}/postgres","database":"{db}"}}}'
      - {until: '"id":3,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      rust:
        stdout: ['"id":2,"result"', 'pw=\[\*\*\*\]', '"id":3,"result"']
        stdout_not: ['=\[{password}\]']
