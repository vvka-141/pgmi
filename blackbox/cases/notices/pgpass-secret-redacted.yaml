description: a password read from ~/.pgpass and printed by the server is shown as *** in notices, errors, --json and serve answers, as one from the connection string is (Rust; contract, "Behaviour changes in 0.20"); Go prints it. The serve step names the server in PGMI_SERVE_HOSTS, since the operator's ~/.pgpass reaches only a server the operator allowed (PGMI-915). It signs in with a login of its own, since a password equal to the login or a database name is not hidden (PGMI-973)
home:
  .pgpass: "{host}:{port}:*:{db}_s:pw-{db}-x\n"
project:
  files:
    deploy.sql: |
      DO $$ BEGIN RAISE NOTICE 'pw=[pw-{db}-x]' USING DETAIL = 'd=[pw-{db}-x]'; END $$;
    fail/deploy.sql: |
      DO $$ BEGIN RAISE EXCEPTION 'pw=[pw-{db}-x]'; END $$;
steps:
  - sql: CREATE ROLE "{db}_s" LOGIN PASSWORD 'pw-{db}-x'
    database: maintenance
  - sql: CREATE DATABASE "{db}" OWNER "{db}_s"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "postgresql://{db}_s@{host}:{port}/{db}", -d, "{db}"]
    expect:
      exit: 0
      stderr: ['pw=\[pw-{db}-x\]', 'd=\[pw-{db}-x\]']
      rust:
        stderr: ['pw=\[\*\*\*\]', 'DETAIL: +d=\[\*\*\*\]']
        stderr_not: ['=\[pw-{db}-x\]']
  - pgmi: [deploy, "{project}", --connection, "postgresql://{db}_s@{host}:{port}/{db}", -d, "{db}", --json]
    expect:
      exit: 0
      rust:
        stdout: ['"message": "pw=\[\*\*\*\]"', '"detail": "d=\[\*\*\*\]"']
        stdout_not: ['=\[pw-{db}-x\]']
  - pgmi: [deploy, "{project}/fail", --connection, "postgresql://{db}_s@{host}:{port}/{db}", -d, "{db}", --json]
    expect:
      exit: 13
      rust:
        stderr: ['pw=\[\*\*\*\]']
        stderr_not: ['=\[pw-{db}-x\]']
        stdout: ['pw=\[\*\*\*\]']
        stdout_not: ['=\[pw-{db}-x\]']
  - pgmi: [serve]
    env: {PGMI_SERVE_HOSTS: "{host}:{port}"}
    stdin:
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"blackbox","version":"1"}}}'
      - '{"jsonrpc":"2.0","method":"notifications/initialized"}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}","connection":"postgresql://{db}_s@{host}:{port}/{db}","database":"{db}"}}}'
      - {until: '"id":2,', timeout: 60}
      - '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"deploy","arguments":{"path":"{project}/fail","connection":"postgresql://{db}_s@{host}:{port}/{db}","database":"{db}"}}}'
      - {until: '"id":3,', timeout: 60}
    timeout: 60
    expect:
      exit: 0
      rust:
        stdout: ['"id":2,"result"', 'pw=\[\*\*\*\]', '"id":3,"result"']
        stdout_not: ['=\[pw-{db}-x\]']
