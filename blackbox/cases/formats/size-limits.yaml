description: a params file or a project .env over PGMI_MAX_FILE_SIZE is read whole by Go and refused with exit 10 by Rust, before connecting (contract "Behaviour changes in 0.20")
project:
  files:
    deploy.sql: "SELECT 1;"
    big.env: "a=0123456789abcdef\n"
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --params-file, "{project}/big.env"]
    env: {PGMI_MAX_FILE_SIZE: "16"}
    expect:
      exit: 0
      rust: {exit: 10, stderr: ["failed to read params file .*big.env: exceeds 16-byte limit \\(override via PGMI_MAX_FILE_SIZE\\)"]}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --params-file, "-"]
    env: {PGMI_MAX_FILE_SIZE: "16"}
    stdin: "a=0123456789abcdef\n"
    expect:
      exit: 0
      rust: {exit: 10, stderr: ["failed to read params file - \\(stdin\\): exceeds 16-byte limit"]}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --params-file, "{project}/big.env"]
    env: {PGMI_MAX_FILE_SIZE: "19"}
    expect: {exit: 0}
