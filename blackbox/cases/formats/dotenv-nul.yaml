description: a NUL byte in the project .env never crashes and never prints the value; Go drops that pair, Rust stops with exit 10 naming the file and the line (contract "Behaviour changes in 0.20", PGMI-1066)
project:
  files:
    .env: {hex: "50474d495f504152414d5f583d6162630068696464656e2d76616c75650a50474d495f504152414d5f593d310a"}
    deploy.sql: |
      DO $$ BEGIN RAISE NOTICE 'x=[%] y=[%]', current_setting('pgmi.x', true), current_setting('pgmi.y', true); END $$;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      stderr: ["x=\\[<NULL>\\] y=\\[1\\]"]
      stderr_not: ["hidden-value", "panicked"]
      stdout_not: ["hidden-value"]
      rust:
        exit: 10
        stderr: ["^pgmi: error: .*\\.env could not be parsed at line \\d+; without its values"]
