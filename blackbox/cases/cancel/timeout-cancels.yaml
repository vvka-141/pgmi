description: --timeout cancels the running statement on the server, so no backend is left running it
project:
  files:
    deploy.sql: SELECT pg_sleep(30);
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --timeout, 2s]
    timeout: 15
    expect:
      exit: 16
      sql:
        - query: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND query LIKE '%pg_sleep(30)%' AND pid <> pg_backend_pid()
          rows: [[0]]
