description: --param beats --params-file (stdin), which beats PGMI_PARAM_*; each reaches pgmi_parameter_view
project:
  files:
    deploy.sql: |
      CREATE TABLE seen AS
      SELECT key, value FROM pg_temp.pgmi_parameter_view WHERE key IN ('a', 'b', 'c');
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --params-file, "-", --param, a=from-flag]
    stdin: |
      a=from-file
      b=from-file
    env:
      PGMI_PARAM_A: from-env
      PGMI_PARAM_B: from-env
      PGMI_PARAM_C: from-env
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows: [[a, from-flag], [b, from-file], [c, from-env]]
