description: deploy's help lists the exit codes in two columns, before the usage
steps:
  - pgmi: [help, deploy]
    expect:
      exit: 0
      stdout: &table ["Exit codes:\\n  0   success                     12  user denied overwrite\\n  1   general error               13  SQL execution failed\\n  2   usage error                 14  deploy\\.sql not found\\n  3   internal panic              15  concurrent deploy in progress\\n  10  invalid configuration       16  timeout exceeded\\n  11  connection failed           130 interrupted by a signal\\nThe signals are SIGINT, SIGTERM, SIGHUP, SIGQUIT, SIGUSR1 and SIGUSR2 \\(Ctrl-C\\non Windows\\): the first cancels the deploy, a second exits at once\\.\\nA --timeout that runs out while connecting is 11"]
  - pgmi: [deploy, --help]
    expect:
      exit: 0
      stdout: *table
