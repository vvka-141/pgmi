description: info summarises a project without a database, as text and as --json
project:
  init: minimal
steps:
  - pgmi: [info, "{project}"]
    expect:
      exit: 0
      stdout: ["Template: minimal", "deploy\\.sql: \\S+ present", "pgmi\\.yaml: absent", "SQL: +1"]
  - pgmi: [info, "{project}", --json]
    expect:
      exit: 0
      json: {template: minimal, deploySql: true, configFile: absent, sqlFiles: 1, testFiles: 0}
  - pgmi: [info]
    cwd: "{project}"
    expect:
      exit: 0
      stdout: ["Template: minimal"]
  - pgmi: [info, "{workdir}/missing"]
    expect:
      exit: 10
      stderr: ["missing"]
