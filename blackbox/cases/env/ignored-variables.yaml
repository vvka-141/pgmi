description: PGHOSTADDR and PGSSLCRL are ignored, as in Go; pointing them somewhere useless changes nothing (owner 2026-11-13, PGMI-973)
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    env:
      PGHOSTADDR: 10.255.255.1
      PGSSLCRL: /no/such/file.crl
    expect:
      exit: 0
