description: PGHOSTADDR and PGSSLCRL are ignored by Go, as its docs say; pointing them somewhere useless changes nothing. Rust refuses each before connecting, exit 10, since it does not honour them either (contract "Behaviour changes in 0.20", PGMI-934)
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    env:
      PGHOSTADDR: 10.255.255.1
      PGSSLCRL: /no/such/file.crl
    expect:
      exit: 0
      rust:
        exit: 10
        stderr: ["PGSSLCRL is set, and pgmi does not support it|PGHOSTADDR is set, and pgmi does not support it"]
