description: numbers where pgmi.yaml expects text stay as written (leading zero, hex, exponent, underscores, sign, sexagesimal, date, beyond 64 bits), both as params and as a database name
project:
  files:
    pgmi.yaml: |
      connection:
        host: "{host}"
        port: {port}
        username: "{user}"
        database: 0123
      params:
        octal: 0123
        octal_new: 0o17
        hex: 0x1F
        exponent: 1e3
        infinity: .inf
        underscore: 1_000
        negative_zero: -0
        plus: +12
        sexagesimal: 1:30
        big: 123456789012345678901234567890
        date: 2001-12-14
    deploy.sql: CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
steps:
  - pgmi: [deploy, "{project}"]
    env: {PGPASSWORD: "{password}", PGDATABASE: "{db}"}
    expect:
      exit: 0
      stderr: ['^database: from PGDATABASE \({db}\), not pgmi.yaml \(0123\)$']
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows:
            - [big, "123456789012345678901234567890"]
            - [date, "2001-12-14"]
            - [exponent, "1e3"]
            - [hex, "0x1F"]
            - [infinity, ".inf"]
            - [negative_zero, "-0"]
            - [octal, "0123"]
            - [octal_new, "0o17"]
            - [plus, "+12"]
            - [sexagesimal, "1:30"]
            - [underscore, "1_000"]
