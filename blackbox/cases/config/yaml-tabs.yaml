description: a tab in pgmi.yaml indentation is invalid configuration (exit 10) naming line 2; tabs after a colon, inside a value or inside a block scalar are fine
project:
  files:
    indent/deploy.sql: SELECT 1;
    indent/pgmi.yaml: "params:\n\tgreeting: one\n"
    inline/deploy.sql: CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
    inline/pgmi.yaml: "params:\n  after_colon:\tone\n  inside: one\ttwo\n  block: |\n    x\ty\n"
steps:
  - pgmi: [deploy, "{project}/indent", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 10
      stderr: ["line 2"]
  - pgmi: [deploy, "{project}/inline", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows:
            - [after_colon, one]
            - [block, "x\ty\n"]
            - [inside, "one\ttwo"]
