description: pgmi.yaml anchors, aliases and merge keys resolve; a key written beside a merge key wins over the merged one
project:
  files:
    pgmi.yaml: |
      connection: &conn
        host: "{host}"
        port: {port}
        username: "{user}"
        database: "{db}"
      params:
        <<: [*conn, {extra: merged}]
        database: own
        greeting: &word hello
        echo: *word
    deploy.sql: CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
steps:
  - pgmi: [deploy, "{project}"]
    env: {PGPASSWORD: "{password}"}
    expect:
      exit: 0
      stderr: ["connection: from pgmi\\.yaml"]
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows:
            - [database, own]
            - [echo, hello]
            - [extra, merged]
            - [greeting, hello]
            - [host, "{host}"]
            - [port, "{port}"]
            - [username, "{user}"]
