description: pgmi.yaml literal and folded block scalars with strip, keep and indentation indicators, multi-line plain and quoted strings reach the session as YAML defines them
project:
  files:
    pgmi.yaml: |
      params:
        literal: |
          one
            two

        literal_strip: |-
          one
          two
        literal_keep: |+
          one

        folded: >
          one
          two

          three
        folded_strip: >-
          one
          two
        indented: |2
            lead
        plain: one
          two
        double: "a\tb
          c"
        single: 'it''s
          x'
    deploy.sql: CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows:
            - [double, "a\tb c"]
            - [folded, "one two\nthree\n"]
            - [folded_strip, one two]
            - [indented, "  lead\n"]
            - [literal, "one\n  two\n"]
            - [literal_keep, "one\n\n"]
            - [literal_strip, "one\ntwo"]
            - [plain, one two]
            - [single, it's x]
