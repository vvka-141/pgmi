description: a flag beats an environment variable, which beats pgmi.yaml, for params and for the target database
project:
  files:
    pgmi.yaml: |
      connection:
        database: wrong_db_from_yaml
      params:
        a: yaml
        b: yaml
        c: yaml
    deploy.sql: |
      CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view WHERE key IN ('a', 'b', 'c');
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --param, a=flag]
    env:
      PGMI_PARAM_A: env
      PGMI_PARAM_B: env
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows: [[a, flag], [b, env], [c, yaml]]
