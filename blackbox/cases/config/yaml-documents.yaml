description: a pgmi.yaml framed by --- and ... is read; a %YAML 1.2 directive is refused (exit 10); with two documents only the first is read
project:
  files:
    framed/deploy.sql: CREATE TABLE framed AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
    framed/pgmi.yaml: "---\nparams:\n  greeting: framed\n...\n"
    directive/deploy.sql: SELECT 1;
    directive/pgmi.yaml: "%YAML 1.2\n---\nparams:\n  greeting: one\n"
    two/deploy.sql: CREATE TABLE two AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
    two/pgmi.yaml: "---\nparams:\n  greeting: first\n---\nparams:\n  greeting: second\n"
steps:
  - pgmi: [deploy, "{project}/framed", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM framed
          rows: [[greeting, framed]]
  - pgmi: [deploy, "{project}/directive", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 10
      stderr: ["incompatible YAML document"]
  - pgmi: [deploy, "{project}/two", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      sql:
        - query: SELECT key, value FROM two
          rows: [[greeting, first]]
