description: YAML 1.1 booleans (on, off, yes, no, y, n, True, FALSE) stay text as written, both as params and as a connection value
project:
  files:
    pgmi.yaml: |
      connection:
        host: "{host}"
        port: {port}
        username: "{user}"
        database: on
      params:
        on: on
        off: off
        yes: yes
        no: no
        y: y
        n: n
        t: True
        f: FALSE
    deploy.sql: CREATE TABLE seen AS SELECT key, value FROM pg_temp.pgmi_parameter_view;
steps:
  - pgmi: [deploy, "{project}"]
    env: {PGPASSWORD: "{password}", PGDATABASE: "{db}"}
    expect:
      exit: 0
      stderr: ['^database: from PGDATABASE \({db}\), not pgmi.yaml \(on\)$']
      sql:
        - query: SELECT key, value FROM seen ORDER BY key
          rows:
            - [f, "FALSE"]
            - [n, "n"]
            - ["no", "no"]
            - ["off", "off"]
            - ["on", "on"]
            - [t, "True"]
            - [y, "y"]
            - ["yes", "yes"]
