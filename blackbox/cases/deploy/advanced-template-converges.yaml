description: the advanced template deploys into a new database and a second deploy over it succeeds
project:
  init: advanced
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --param, env=dev]
    timeout: 300
    expect:
      exit: 0
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --param, env=dev]
    timeout: 300
    expect:
      exit: 0
      sql:
        - query: SELECT count(*) > 0 FROM pg_namespace WHERE nspname = 'api'
          rows: [[true]]
