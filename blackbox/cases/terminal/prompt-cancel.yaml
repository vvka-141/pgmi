description: on a terminal, end of input at the overwrite prompt is exit 12 and SIGINT is 130; SIGINT during the --force countdown is 130 and drops nothing; Ctrl-C typed in the config wizard is 130
project:
  files:
    deploy.sql: |
      CREATE TABLE IF NOT EXISTS marker (n int);
      INSERT INTO marker VALUES (1);
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect: {exit: 0}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --overwrite]
    tty: true
    stdin: [{wait: 2}, "\x04"]
    timeout: 30
    expect:
      exit: 12
      stdout: ["No input available", 'pgmi: error: approval denied\s*$']
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --overwrite]
    tty: true
    stdin: [{wait: 5}]
    signal: {name: SIGINT, after: 2}
    timeout: 30
    expect: {exit: 130, stdout: ["pgmi: error: overwrite cancelled"]}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --overwrite, --force]
    tty: true
    env: {PGMI_NO_BANNER: "1"}
    stdin: [{wait: 5}]
    signal: {name: SIGINT, after: 2}
    timeout: 30
    expect:
      exit: 130
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[1]]
  - pgmi: [config, "{project}"]
    tty: true
    stdin: [{wait: 2}, "\x03"]
    timeout: 30
    expect: {exit: 130}
