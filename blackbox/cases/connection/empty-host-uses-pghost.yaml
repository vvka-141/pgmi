description: a connection string whose host is empty leaves the host unset, in every form, so PGHOST applies as it does in psql for a URI - the deploy goes to PGHOST's server and never silently to localhost (PGMI-1073). Here PGHOST names another address and the string a port nothing listens on, so each form is exit 11 naming PGHOST's address, not localhost; with PGHOST naming the server the same strings deploy. That is Go; the Rust binary refuses an empty host before connecting (exit 10, PGMI-1105), so it never goes to localhost either
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@:1/postgres", -d, "{db}"]
    env: {PGHOST: 127.0.0.2, PGSSLMODE: disable}
    timeout: 30
    expect:
      exit: 11
      stderr: ["127\\.0\\.0\\.2"]
      rust:
        exit: 10
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@:1/postgres?host=", -d, "{db}"]
    env: {PGHOST: 127.0.0.2, PGSSLMODE: disable}
    timeout: 30
    expect:
      exit: 11
      stderr: ["127\\.0\\.0\\.2"]
      rust:
        exit: 10
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
  - pgmi: [deploy, "{project}", --connection, "host='' port=1 user={user} password={password} dbname=postgres", -d, "{db}"]
    env: {PGHOST: 127.0.0.2, PGSSLMODE: disable}
    timeout: 30
    expect:
      exit: 11
      stderr: ["127\\.0\\.0\\.2"]
      rust:
        exit: 10
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
  - pgmi: [deploy, "{project}", --connection, "Host=;Port=1;Username={user};Password={password};Database=postgres", -d, "{db}"]
    env: {PGHOST: 127.0.0.2, PGSSLMODE: disable}
    timeout: 30
    expect:
      exit: 11
      stderr: ["127\\.0\\.0\\.2"]
      rust:
        exit: 10
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
  - pgmi: [deploy, "{project}", --connection, "postgresql://{user}:{password}@:{port}/postgres", -d, "{db}"]
    env: {PGHOST: "{host}", PGSSLMODE: disable}
    expect:
      exit: 0
      rust:
        exit: 10
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
