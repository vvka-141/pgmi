description: a connection setting written empty is refused before connecting by the Rust binary (exit 10), naming the setting and where it was written, instead of being read as unset - a key of a keyword, URI or ADO.NET connection string, a URI with a colon and no port, a connection flag, a PG* variable, DATABASE_URL and a pgmi.yaml value (PGMI-1105). Go reads each as unset and deploys with the next source or the built-in default; here that is still the server of the test, so Go exits 0. A password is not judged - an empty one is no password - and a variable that a nearer source replaces is not read
project:
  files:
    deploy.sql: SELECT 1;
    yamlp/deploy.sql: SELECT 1;
    yamlp/pgmi.yaml: |
      connection:
        host: "{host}"
        port: {port}
        username: "{user}"
        database: "{db}"
        sslmode: ""
steps:
  - pgmi: ["deploy", "{project}", "--connection", "host={host} port={port} user={user} password={password} dbname=postgres sslmode=''", "-d", "{db}"]
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the sslmode from --connection is empty; write the sslmode, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "--connection", "postgresql://{user}:{password}@{host}:{port}/postgres?application_name=", "-d", "{db}"]
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the application_name from --connection is empty; write the application_name, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "--connection", "Host={host};Port={port};Username={user};Password={password};Database=postgres;Application Name=;", "-d", "{db}"]
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the application_name from --connection is empty; write the application_name, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "--connection", "postgresql://{user}:{password}@{host}:/postgres", "-d", "{db}"]
    env: {"PGPORT": "{port}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the port from --connection is empty; write the port, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "--connection", "postgresql://{user}:{password}@:{port}/postgres", "-d", "{db}"]
    env: {"PGHOST": "{host}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the host from --connection is empty; write the host, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "-h", "{host}", "-p", "{port}", "-U", "{user}", "-d", "{db}", "--sslrootcert", ""]
    env: {"PGPASSWORD": "{password}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the sslrootcert from --sslrootcert is empty; write the sslrootcert, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "-h", "", "-p", "{port}", "-U", "{user}", "-d", "{db}"]
    env: {"PGHOST": "{host}", "PGPASSWORD": "{password}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the host from -h is empty; write the host, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "-h", "{host}", "-p", "{port}", "-U", "{user}", "-d", "{db}"]
    env: {"PGSSLMODE": "", "PGPASSWORD": "{password}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the sslmode from PGSSLMODE is empty; write the sslmode, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "-d", "{db}"]
    env: {"PGHOST": "{host}", "PGPORT": "{port}", "PGUSER": "{user}", "PGPASSWORD": "{password}", "DATABASE_URL": ""}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the connection string from DATABASE_URL is empty; write the connection string, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}/yamlp"]
    env: {"PGPASSWORD": "{password}"}
    expect:
      exit: 0
      rust:
        exit: 10
        stdout_not: ['^ok ']
        stderr: ['^pgmi: error: the sslmode from pgmi\.yaml is empty; write the sslmode, or remove it so the next source applies$']
  - pgmi: ["deploy", "{project}", "--connection", "host={host} port={port} user={user} password={password} dbname=postgres", "-d", "{db}"]
    env: {"PGHOST": "", "PGPORT": ""}
    expect: {exit: 0}
  - pgmi: ["deploy", "{project}", "--connection", "host={host} port={port} user={user} dbname=postgres password=''", "-d", "{db}"]
    env: {"PGPASSWORD": ""}
    expect:
      exit: 11
      stderr_not: ['is empty; write']
