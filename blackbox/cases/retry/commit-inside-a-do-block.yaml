description: owner decision 2026-11-14 (PGMI-977). deploy.sql is one DO block that commits and then fails with an error that is otherwise retried - the commit may have happened, so the deploy is never retried and never says nothing committed; the INSERT ran once (exit 13)
project:
  files:
    deploy.sql: |
      DO $$
      BEGIN
          INSERT INTO marker VALUES ('ran');
          COMMIT;
          RAISE EXCEPTION 'lock busy' USING ERRCODE = '55P03';
      END $$;
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - sql: CREATE TABLE marker (v text)
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 13
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[1]]
      rust:
        stderr: ["not retried: unit 1 of 1 is a DO block or CALL, which may have committed before it failed$", "may have committed before it failed; check the database"]
        stderr_not: ["retrying in", "nothing committed"]
