description: Rust only (contract "Whole-deployment retry"). A first attempt that never reaches the server (four startups refused with 53300 too many connections, or with 08P01) fails fast as in Go, exit 11 with no whole-deploy retry (owner decision PGMI-909); once an attempt has connected, class 08 mid-run (FATAL 08P01 in the tail) is retried
impl: rust
proxy:
  - {at: startup, do: {error: "53300"}, times: 4, step: 1}
  - {at: startup, do: {error: "08P01"}, times: 4, step: 2}
  - {query: tail_sleep, do: {error: "08P01"}, after: 0.5, times: 1, step: 3}
project:
  files:
    deploy.sql: |
      SET client_connection_check_interval = '100ms';
      CREATE TABLE IF NOT EXISTS marker (n int);
      INSERT INTO marker VALUES (1);
      COMMIT;
      SELECT pg_sleep(1) AS tail_sleep;
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 11
      stderr: ["Connection attempt 3 failed: .*too many"]
      stderr_not: ["^pgmi: attempt 1 failed"]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 11
      stderr: ["Connection attempt 3 failed: .*invalid frontend message type"]
      stderr_not: ["^pgmi: attempt 1 failed"]
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 0
      stderr: ["^pgmi: attempt 1 failed \\(08P01 connection exception\\); retrying in"]
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[2]]
