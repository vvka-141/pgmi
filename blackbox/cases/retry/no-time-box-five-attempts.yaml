description: Rust only (contract "Whole-deployment retry"). With --timeout 0 (no time box) a deploy that keeps failing with 55P03 stops after 5 attempts, each retry line counting the attempts left, and fails with the last error's exit code (13)
impl: rust
proxy:
  - {query: "INSERT INTO marker", do: {error: "55P03", severity: ERROR}}
project:
  files:
    deploy.sql: |
      CREATE TABLE IF NOT EXISTS marker (n int);
      INSERT INTO marker VALUES (1);
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}", --timeout, "0"]
    timeout: 45
    expect:
      exit: 13
      stderr:
        - "^pgmi: attempt 1 failed \\(55P03 lock not available\\); retrying in [0-9.]+s, 4 attempts left$"
        - "^pgmi: attempt 4 failed \\(55P03 lock not available\\); retrying in [0-9.]+s, 1 attempt left$"
        - "^pgmi: error: gave up after 5 attempts with no time box \\(--timeout 0\\); last error: ERROR: .*\\(SQLSTATE 55P03\\)"
      stderr_not: ["attempt 5 failed"]
