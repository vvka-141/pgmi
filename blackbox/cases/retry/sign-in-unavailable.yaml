description: Rust only (contract "Whole-deployment retry"). A sign-in endpoint that still answers 503 after its own three tries (Databricks Lakebase) on the first attempt fails fast, exit 11 with the endpoint's answer and no whole-deploy retry, because no attempt has reached the server yet (owner decision PGMI-909); a refused sign-in (401) is final at once
impl: rust
servers: [tls, fakes]
project:
  files:
    deploy.sql: SELECT 1;
steps:
  - pgmi: [deploy, "{project}", --databricks, --databricks-endpoint, "projects/p/branches/b/endpoints/{db}-503", --connection, "host=127.0.0.1 port={tls_port} user={lakebase_user} dbname=postgres sslmode=require", --timeout, 8s]
    env: {DATABRICKS_HOST: "{fake_https}", DATABRICKS_TOKEN: "{databricks_pat}-503", SSL_CERT_FILE: "{ca}"}
    timeout: 30
    expect:
      exit: 11
      stderr: ["503 Service Unavailable"]
      stderr_not: ["{databricks_pat}", "^pgmi: attempt 1 failed"]
      files:
        "{fake_https_log}": ['(endpoints/{db}-503"[\s\S]*){3}']
  - pgmi: [deploy, "{project}", --databricks, --databricks-endpoint, "projects/p/branches/b/endpoints/e", --connection, "host=127.0.0.1 port={tls_port} user={lakebase_user} dbname=postgres sslmode=require"]
    env: {DATABRICKS_HOST: "{fake_https}", DATABRICKS_TOKEN: unknown-pat-0815, SSL_CERT_FILE: "{ca}"}
    timeout: 30
    expect:
      exit: 11
      stderr: ["401 Unauthorized"]
      stderr_not: ["attempt 1 failed", "unknown-pat-0815"]
