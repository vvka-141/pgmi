description: Rust only (contract "Whole-deployment retry"). A FATAL 57P01 (admin shutdown) after which the server reports a new start time (pg_postmaster_start_time; the proxy rewrites it to fake a restart) is a server restart, so the deploy runs again and succeeds, the head committed once (owner 2026-11-14, PGMI-1000)
impl: rust
proxy:
  - {query: pg_postmaster_start_time, do: {delay: 0}, times: 1}
  - {query: head_sleep, do: {error: "57P01"}, after: 0.5, times: 1}
  - {query: pg_postmaster_start_time, do: {value: "2000-01-01 00:00:00+00", column: 2}, times: 1}
project:
  files:
    deploy.sql: |
      SET client_connection_check_interval = '100ms';
      BEGIN;
      CREATE TABLE IF NOT EXISTS marker (phase text);
      INSERT INTO marker VALUES ('head');
      SELECT pg_sleep(1) AS head_sleep;
      COMMIT;
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 0
      stderr: ["^pgmi: attempt 1 failed \\(57P01 admin shutdown\\); retrying in"]
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[1]]
