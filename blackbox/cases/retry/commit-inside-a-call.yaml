description: owner decision 2026-11-14 (PGMI-977). deploy.sql is one CALL of a procedure that commits and then fails with an error that is otherwise retried - never retried, never "nothing committed"; the INSERT ran once (exit 13)
project:
  files:
    deploy.sql: |
      CALL commit_then_fail();
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - sql: |
      CREATE TABLE marker (v text);
      CREATE PROCEDURE commit_then_fail() LANGUAGE plpgsql AS $$
      BEGIN
          INSERT INTO marker VALUES ('ran');
          COMMIT;
          RAISE EXCEPTION 'serialization' USING ERRCODE = '40001';
      END $$;
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    timeout: 30
    expect:
      exit: 13
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[1]]
      rust:
        stderr: ["not retried: unit 1 of 1 is a DO block or CALL, which may have committed before it failed$"]
        stderr_not: ["retrying in", "nothing committed"]
