description: Rust only (contract "Whole-deployment retry"). The client side of the first attempt is cut while it loads the session, after taking the deploy lock, and the server never learns it (a NAT or load-balancer drop), so the orphaned backend still holds the lock; the retry ends pgmi's own earlier session instead of failing with exit 15, and only the retry commits
impl: rust
proxy:
  - {query: "PGMI Session Schema", do: cut-client, times: 1}
project:
  files:
    deploy.sql: |
      CREATE TABLE IF NOT EXISTS marker (n int);
      INSERT INTO marker VALUES (1);
      SELECT pg_sleep(0.1);
steps:
  - sql: CREATE DATABASE "{db}"
    database: maintenance
  - pgmi: [deploy, "{project}", --connection, "{proxy_conn}", -d, "{db}", --timeout, 40s]
    timeout: 60
    expect:
      exit: 0
      stderr:
        - "^pgmi: attempt 1 failed \\(connection lost\\); retrying in"
        - "^pgmi: the deploy lock is held by this deploy's earlier session \\(pid [0-9]+\\), which the server has not noticed is gone; ending it"
      sql:
        - query: SELECT count(*) FROM marker
          rows: [[1]]
