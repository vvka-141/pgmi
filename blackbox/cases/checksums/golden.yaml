description: checksum and pgmi_checksum of edge-case files equal the values the Go binary produced; reformatting keeps pgmi_checksum, a literal change does not
project:
  files:
    same/a-plain.sql: "SELECT id FROM users WHERE name = 'Ann';\n"
    same/b-case-spacing.sql: "select   ID\n\tfrom USERS where NAME = 'Ann';\n"
    same/c-comments.sql: "-- leading comment\nSELECT id /* inline */ FROM users -- trailing\nWHERE name = 'Ann';"
    same/d-crlf.sql: "SELECT id FROM users\r\nWHERE name = 'Ann';\r\n"
    same/e-nested-comment.sql: "/* outer /* inner */ still comment */ SELECT id FROM users WHERE name = 'Ann';\n"
    diff/literal-case.sql: "SELECT id FROM users WHERE name = 'ANN';\n"
    diff/quoted-ident.sql: "SELECT id FROM \"Users\" WHERE name = 'Ann';\n"
    edge/bom.sql: "﻿SELECT 1;\n"
    edge/no-final-newline.sql: "SELECT 1;"
    edge/empty.sql: ""
    edge/comment-only.sql: "-- nothing here\n/* or here */\n"
    edge/dollar-quote.sql: "DO $body$ BEGIN RAISE NOTICE '-- not a comment /* nor this */ KEEP Case'; END $body$;\n"
    edge/escape-string.sql: "SELECT E'It\\'s -- here', 'it''s /* here */';\n"
    edge/unicode-ident.sql: "SELECT Ärger, İstanbul, ß FROM Straße;\n"
    edge/unicode-literal.sql: "SELECT 'Ärger İstanbul ß';\n"
    edge/tabs-and-blank-lines.sql: "\n\n\tSELECT\t1\t;\n\n\n"
    edge/u-amp.sql: "SELECT U&'d\\0061t\\+000061' AS \"Mixed\";\n"
    edge/unicode-space-ends.sql: "\u00a0\u3000SELECT 1;\u2028\u0085\n"
    edge/unicode-space-inside.sql: "SELECT\u00a01;\n"
    edge/zero-width-ends.sql: "\u200bSELECT 1;\ufeff\n"
    deploy.sql: |
      CREATE TABLE sums AS
      SELECT path, checksum, pgmi_checksum FROM pg_temp.pgmi_source_view;
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}"]
    expect:
      exit: 0
      sql:
        - query: SELECT count(DISTINCT pgmi_checksum) FROM sums WHERE path LIKE './same/%'
          rows: [[1]]
        - query: |
            SELECT count(*) FROM sums d JOIN sums s ON s.path = './same/a-plain.sql'
            WHERE d.path LIKE './diff/%' AND d.pgmi_checksum = s.pgmi_checksum
          rows: [[0]]
        - query: SELECT count(DISTINCT checksum) FROM sums WHERE path LIKE './same/%'
          rows: [[5]]
        - query: SELECT path, checksum, pgmi_checksum FROM sums ORDER BY path
          rows:
            - [./diff/literal-case.sql, 099005953775757bcf8c421726dacb65fa00b3ea826767b84d92ca2b3ee98fc5, df33159839169ebb98ba4e60805d157581460e4ef3933dbeb177bb519e840b0a]
            - [./diff/quoted-ident.sql, 5114864a85f2d88007088a747ce5dcf5105bc260c4cf182edb9a8c64327570c0, 66f6443832a5f5c792eab005df078ae58f5a4dda3cc001cfe36019d18699b5c9]
            - [./edge/bom.sql, b4e0497804e46e0a0b0b8c31975b062152d551bac49c3c2e80932567b4085dcd, 354b7196c9ba5fb4b21cf615bb6ec4cd5c07503c34229feef033fc081a8c03f4]
