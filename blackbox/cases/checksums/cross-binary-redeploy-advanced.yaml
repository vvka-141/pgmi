description: the advanced template scaffolded and deployed by the reference binary (the last Go release) redeploys with the binary under test
project:
  init: advanced
  init_binary: reference
steps:
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --param, env=dev]
    binary: reference
    timeout: 300
    expect: {exit: 0}
  - pgmi: [deploy, "{project}", --connection, "{conn}", -d, "{db}", --param, env=dev]
    timeout: 300
    expect: {exit: 0}
