[project]
name = "pgmi-blackbox"
version = "0.1.0"
description = "Black-box test suite for any pgmi binary"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["test_cases.py", "selftest"]
addopts = "-ra --tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pgmi_blackbox"]
