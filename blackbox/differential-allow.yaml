# Differences the 0.20 table in docs/design/behaviour-contract.md decided. See README "Differential run".
skip:
  cases/terminal/config-wizard.yaml: &wizard >-
    full-screen wizard: the two TUI libraries paint the same screen with different escape streams, so the
    stripped text is not comparable; the case's own regexes judge it
  cases/terminal/config-esc.yaml: *wizard
  cases/terminal/config-refusals.yaml: *wizard
  cases/terminal/init-wizard.yaml: *wizard
  cases/terminal/init-wizard-connection.yaml: *wizard
  cases/terminal/init-wizard-connection-esc.yaml: *wizard

accept:
