    case: cases/(notices/(pgpass-)?secrets-redacted|errors/diagnostics-secrets)\.yaml
    field: json
    rust: \*\*\*
  - row: Connection-string parse errors
    case: cases/errors/connection-string-(secrets|password-rest)\.yaml
    field: stderr
    rust: "--connection: invalid"
