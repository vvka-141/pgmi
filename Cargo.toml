[workspace]
resolver = "3"
members = ["rust/pgmi", "shared"]
exclude = ["shared/templates/advanced/gateways/rust", "rust/spikes", "rust/pgmi/fuzz"]

[workspace.package]
version = "0.20.0-alpha.1"
edition = "2024"
rust-version = "1.94.1"
license = "MPL-2.0"
repository = "https://github.com/vvka-141/pgmi"

[workspace.dependencies]
aes = "0.9.4"
async-trait = "0.1"
aws-config = { version = "1.13.1", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "credentials-login"] }
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.5", default-features = false, features = ["sign-http"] }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", default-features = false, features = ["http-body-1-x"] }
azure_core = { version = "1.1.0", default-features = false, features = ["reqwest", "tokio"] }
azure_identity = { version = "1.0.0", default-features = false, features = ["tokio"] }
base64ct = { version = "1.8.0", features = ["alloc"] }
cbc = "0.2.1"
cms = { version = "=0.3.0-rc.2", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "error-context", "help", "usage", "suggestions"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
des = "0.9.0"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
google-cloud-auth = { version = "1.18.0", default-features = false }
hmac = "0.13.0"
http = "1"
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
libc = { version = "0.2.191", default-features = false }
md-5 = "0.11.0"
p12-keystore = "=0.4.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
pgmi-shared = { path = "shared", version = "=0.20.0-alpha.1" }
pkcs12 = { version = "=0.2.0-rc.0", default-features = false, features = ["kdf"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "3des", "sha1-insecure"] }
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
rand = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21.2"
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
rsa = "0.10.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha1 = "0.11"
sha2 = "0.11.1"
stringprep = "0.1.5"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync", "macros", "fs"] }
tokio-postgres = { version = "0.7.18", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
tokio-util = { version = "0.7.20", default-features = false }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", default-features = false, features = ["std", "v4"] }
x509-cert = { version = "0.3.0", default-features = false }
yaml-edit = { version = "0.3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
items_after_statements = "allow"
assert_is_empty = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_precision_loss = "allow"
unnecessary_wraps = "allow"
struct_field_names = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
naive_bytecount = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
