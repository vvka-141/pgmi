[workspace]
resolver = "3"
members = ["rust/pgmi", "shared"]
exclude = ["shared/templates/advanced/gateways/rust", "rust/spikes"]

[workspace.package]
version = "0.20.0-alpha.1"
edition = "2024"
rust-version = "1.94.1"
license = "MPL-2.0"
repository = "https://github.com/vvka-141/pgmi"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
