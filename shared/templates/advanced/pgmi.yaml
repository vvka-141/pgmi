# pgmi project configuration
# CLI flags override these values. Environment variables (PGHOST, PGDATABASE, ...)
# override them too; pgmi names each one it applies over a value set here.

connection:
  database: mydb              # Target database (change this!)
  host: localhost             # PostgreSQL host
  port: 5432                  # PostgreSQL port
  # sslmode: verify-full      # Default: prefer; TLS only with cloud sign-in (--azure, --aws, --google)
  # username: postgres        # PostgreSQL user (default: current OS user)

# Parameters passed to deploy.sql
# See deploy/parameters.xml for all declared parameters and their descriptions.
# env (dev, test or prod) is required and deliberately not set here, so a
# committed file can never make a production deploy look like dev. The database
# remembers its env and refuses a redeploy that names another. Pass it per deploy:
#   local:  pgmi deploy . -d mydb --param env=dev
#           (role passwords default to 'postgres': disposable databases only)
#   shared: PGMI_PARAM_DATABASE_ADMIN_PASSWORD=... pgmi deploy . -d mydb --param env=prod
#           (the environment, stdin or a params file; never --param for a secret)
# params:
#   some_setting: value

timeout: 5m                   # Deployment timeout
