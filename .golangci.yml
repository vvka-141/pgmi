run:
  # Catches a hung linter, not a slow one. Measured here: 81s warm, 6m36s and
  # 7m26s cold, because a cold pass compiles the whole dependency tree (AWS,
  # Azure, GCP SDKs, OpenTelemetry) before any analysis runs. 5m failed there
  # outright, with a message that reads like a linter problem. Cold is not
  # exotic: the SQL change protocol mandates `go clean -cache`, `make lint`
  # then runs two passes, and CI hits it whenever the action's cache misses.
  timeout: 15m
  tests: true

linters:
  enable:
    - errcheck
    - gofmt
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Writer).Write
      - fmt.Fprintf
      - fmt.Fprintln

issues:
  exclude-rules:
    # Ignore errcheck in test files - test code often ignores errors intentionally
    - path: _test\.go
      linters:
        - errcheck

    # Ignore unused in test files - mock types may be for future use
    - path: _test\.go
      linters:
        - unused

    # Ignore benchmark files completely
    - path: _bench_test\.go
      linters:
        - errcheck
        - gosimple

    # Ignore example files - they're documentation
    - path: example_test\.go
      linters:
        - errcheck

  # Don't limit the number of issues
  max-issues-per-linter: 0
  max-same-issues: 0
