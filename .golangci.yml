version: "2"
run:
  # Catches a hung linter, not a slow one. Measured here: 81s warm, 6m36s and
  # 7m26s cold, because a cold pass compiles the whole dependency tree (AWS,
  # Azure, GCP SDKs, OpenTelemetry) before any analysis runs. 5m failed there
  # outright, with a message that reads like a linter problem. Cold is not
  # exotic: the SQL change protocol mandates `go clean -cache`, `make lint`
  # then runs two passes, and CI hits it whenever the action's cache misses.
  timeout: 15m
  tests: true
linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Writer).Write
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      # ST1005 off: several user-facing errors are deliberately capitalized,
      # punctuated or multi-line.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
          - staticcheck
        path: _bench_test\.go
      - linters:
          - errcheck
        path: example_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
