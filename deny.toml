[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "0BSD"]

[bans]
multiple-versions = "warn"
skip = [
    { crate = "base64@0.22.1", reason = "tokio-postgres and azure_core; google-cloud-auth and hyper-util are on 0.23" },
    { crate = "digest@0.10.7", reason = "aws-config's sha1/sha2 0.10; pgmi's RustCrypto stack is on 0.11" },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10 under aws-config" },
    { crate = "crypto-common@0.1.7", reason = "digest 0.10 under aws-config" },
    { crate = "cpufeatures@0.2.17", reason = "sha1/sha2 0.10 under aws-config" },
    { crate = "sha1@0.10.7", reason = "aws-config" },
    { crate = "sha2@0.10.9", reason = "aws-config" },
    { crate = "hashbrown@0.14.5", reason = "rowan under yaml-edit" },
    { crate = "syn@2.0.119", reason = "most proc-macro crates; async-trait is on syn 3" },
    { crate = "synstructure@0.13.2", reason = "syn 2 proc macros" },
    { crate = "wasi@0.14.7+wasi-0.2.4", reason = "whoami under tokio-postgres; mio is on 0.11" },
]
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "cc", reason = "compiles C (PGMI-855, record 0021)" },
    { name = "cmake", reason = "compiles C (PGMI-855)" },
    { name = "bindgen", reason = "C bindings (PGMI-855)" },
    { name = "pkg-config", reason = "links system C libraries (PGMI-855)" },
    { name = "vcpkg", reason = "links system C libraries (PGMI-855)" },
    { name = "openssl", reason = "C (PGMI-855)" },
    { name = "openssl-sys", reason = "C (PGMI-855)" },
    { name = "native-tls", reason = "OpenSSL or platform TLS (PGMI-855)" },
    { name = "aws-lc-rs", reason = "C (PGMI-855)" },
    { name = "aws-lc-sys", reason = "C (PGMI-855)" },
    { name = "ring", reason = "C and assembly (PGMI-855)" },
    { name = "libz-sys", reason = "C (PGMI-855)" },
    { name = "zstd-sys", reason = "C (PGMI-855)" },
    { name = "psm", reason = "compiles assembly with cc (PGMI-855)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
